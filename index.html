<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>School Website</title>
<meta name="description" content="Official school website — notices, results, teachers, events and gallery.">
<style>
/* ================= Public Website Theme ================= */
:root{
  /* Cantonment / Government School Theme — navy, maroon & gold */
  --brand:#0b2545;
  --brand-2:#123a6b;
  --brand-dark:#071733;
  --brand-soft:#eaf0f8;
  --maroon:#7a1129;
  --maroon-dark:#560b1c;
  --accent:#c9a227;
  --accent-2:#e6c34d;
  --ink:#16202e;
  --muted:#5b6675;
  --line:#dde3ec;
  --bg:#f4f6f9;
  --card:#ffffff;
  --radius:10px;
  --shadow:0 6px 22px rgba(11,37,69,.09);
  --shadow-lg:0 18px 44px rgba(11,37,69,.16);
  --max:1180px;
  --font:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',Roboto,Arial,sans-serif;
  --grad:linear-gradient(135deg,#0b2545 0%,#123a6b 60%,#0b2545 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px}
img{max-width:100%;display:block}
a{color:var(--brand);text-decoration:none;transition:color .2s}
a:hover{color:var(--brand-2)}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-weight:750;letter-spacing:-.3px}
h1{font-size:clamp(2rem,4.2vw,3.1rem)}
h2{font-size:clamp(1.45rem,2.7vw,2.1rem)}
p{margin:0 0 1rem}
.mb0{margin-bottom:0}
.container{max-width:var(--max);margin:0 auto;padding:0 18px}
.section{padding:72px 0;position:relative}
.section.alt{background:linear-gradient(180deg,#ffffff 0%,#f7fbf9 100%)}
.center{text-align:center}
.muted{color:var(--muted)}
.sec-head{text-align:center;max-width:740px;margin:0 auto 44px}
.sec-head .kicker{display:inline-block;color:var(--brand-2);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;font-size:.78rem;
  background:var(--brand-soft);padding:5px 14px;border-radius:99px;margin-bottom:10px}
.sec-head h2{margin:.4rem 0 .6rem}
.sec-head h2::after{content:'';display:block;width:56px;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:4px;margin:12px auto 0}
.sec-head p{color:var(--muted);margin:0;font-size:1.02rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;
  background:var(--grad);color:#fff;padding:12px 22px;border-radius:12px;font:inherit;font-weight:650;
  cursor:pointer;transition:all .22s ease;white-space:nowrap;box-shadow:0 4px 14px rgba(10,92,71,.22)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(10,92,71,.3);color:#fff}
.btn-outline{background:transparent;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
.btn-outline:hover{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(10,92,71,.2)}
.btn-light{background:#fff;color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.btn-light:hover{background:var(--brand-soft);color:var(--brand-dark);transform:translateY(-1px)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#2a1f00;box-shadow:0 4px 14px rgba(232,168,23,.35)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(232,168,23,.45);color:#2a1f00}
.btn-sm{padding:8px 14px;font-size:.86rem;border-radius:10px}
.btn-block{width:100%}

/* ---------- topbar / header (cantonment / govt style) ---------- */
.topbar{background:var(--maroon-dark);color:#f1dfe3;font-size:.82rem;border-bottom:2px solid var(--accent)}
.topbar .container{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;padding-top:7px;padding-bottom:7px}
.topbar a{color:#f6e9ec}
.topbar .tb-links{display:flex;gap:14px;align-items:center}
header.site{position:sticky;top:0;z-index:60;background:var(--brand);box-shadow:0 4px 18px rgba(7,23,51,.35)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;padding:16px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:0 0 auto;overflow:hidden;text-align:left}
.nav>nav{flex:1 1 320px;display:flex;justify-content:flex-end}
.brand .logo{width:60px;height:60px;border-radius:50%;object-fit:cover;background:var(--accent);color:var(--brand-dark);
  display:grid;place-items:center;font-weight:800;font-size:1.25rem;flex:0 0 auto;border:3px solid var(--accent-2)}
.brand>span{min-width:0;overflow:visible}
.brand b{display:block;font-size:1.62rem;line-height:1.28;white-space:normal;max-width:360px;color:#fff;letter-spacing:.2px}
.brand small{color:#d8c78e;font-size:.85rem;display:block;white-space:nowrap}
header.site::after{content:'';display:block;height:5px;background:linear-gradient(90deg,var(--maroon),var(--accent) 50%,var(--brand))}
.menu{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:6px 4px;list-style:none;margin:0;padding:0}
.menu a{padding:9px 12px;border-radius:6px;color:#fff;font-weight:600;font-size:.86rem;white-space:nowrap}
.menu a:hover{background:rgba(255,255,255,.14);color:#fff}
.menu a.active{background:rgba(255,255,255,.18);color:#fff}
.menu li:last-child a{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#2a1f00!important;font-weight:700;border-radius:8px;margin-left:6px}
/* ---------- notice ticker ---------- */
.ticker-bar{background:var(--brand-soft);border-bottom:1px solid var(--line);overflow:hidden;position:sticky;top:0;z-index:59}
.ticker-bar .container{display:flex;align-items:center;gap:12px;padding:0}
.ticker-tag{flex:0 0 auto;background:var(--maroon);color:#fff;font-weight:700;font-size:.8rem;padding:7px 14px;display:flex;align-items:center;gap:6px}
.ticker-view{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:34px}
.ticker-track{display:inline-flex;gap:60px;position:absolute;white-space:nowrap;animation:ticker-scroll 28s linear infinite;padding-left:100%;align-items:center;height:34px}
.ticker-track a{color:var(--brand);font-size:.86rem;font-weight:600}
.ticker-bar:hover .ticker-track{animation-play-state:paused}
@keyframes ticker-scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.mobile-menu{display:none}
.burger{display:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px 11px;font-size:1.2rem;cursor:pointer;color:#fff}

/* ---------- hero slider ---------- */
.hero{position:relative;height:min(74vh,560px);overflow:hidden;background:#071733}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;background-size:cover;background-position:center;display:grid;place-items:center}
.slide.on{opacity:1}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(7,23,51,.94) 0%,rgba(11,37,69,.74) 45%,rgba(0,0,0,.42) 100%)}
.slide-in{position:relative;z-index:2;color:#fff;max-width:780px;padding:0 22px;text-align:center}
.slide-in h1{color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.35);letter-spacing:-.4px}
.slide-in p{color:#e8f5f0;font-size:1.08rem;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.hero-dots{position:absolute;bottom:22px;left:0;right:0;display:flex;gap:9px;justify-content:center;z-index:3}
.hero-dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0;transition:all .25s}
.hero-dots button.on{background:var(--accent);width:30px;border-radius:8px;box-shadow:0 0 12px rgba(232,168,23,.5)}

/* ---------- stats strip ---------- */
.stats{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.stats::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(255,255,255,.08),transparent 50%)}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:32px 0;position:relative}
.stat{text-align:center}
.stat b{display:block;font-size:2.1rem;line-height:1.1;font-weight:800}
.stat span{font-size:.88rem;color:#c7d6ec;letter-spacing:.3px}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:all .25s ease}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card-pad{padding:22px}
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;transition:all .28s ease;
  position:relative;overflow:hidden}
.feature::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--accent));opacity:0;transition:opacity .25s}
.feature:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent}
.feature:hover::before{opacity:1}
.feature .ic{font-size:2.1rem;margin-bottom:10px;display:inline-block}
.feature h4{margin:0 0 6px;font-size:1.08rem}
.feature p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.55}

/* notices */
.notice-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.notice-item:last-child{border-bottom:0}
.ndate{flex:0 0 62px;height:62px;border-radius:12px;background:#eef6f2;color:var(--brand);display:grid;place-content:center;text-align:center;font-weight:700;line-height:1.1}
.ndate span{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}
.notice-item h4{margin:0 0 2px;font-size:1rem}
.notice-item p{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* teacher card */
.tcard{text-align:center;padding:22px 16px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 12px;background:#e8f1ed;color:var(--brand);
  display:grid;place-items:center;font-size:2rem;font-weight:700;border:3px solid #e8f1ed}
.badge{display:inline-block;background:#eef6f2;color:var(--brand);border-radius:99px;padding:3px 11px;font-size:.76rem;font-weight:600}
.badge.warn{background:#fff4e0;color:#a56a00}.badge.dan{background:#fdecec;color:#b32020}.badge.ok{background:#e8f7ee;color:#146c3a}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gal figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#e8eef2;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;transition:.3s}
.gal figure:hover img{transform:scale(1.06)}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.input:focus{outline:2px solid #bfe0d3;border-color:var(--brand)}
.err{color:#c62828;font-size:.8rem;margin-top:4px;display:block}

/* table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.tbl th{background:#f2f7f5;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:#3d5a4e}
table.tbl tbody tr:hover{background:#fafcfb}

/* footer */
footer.site{background:#071733;color:#b9c6dc;padding:52px 0 0;margin-top:40px}
footer.site h4{color:#fff;font-size:1rem;margin-bottom:14px}
footer.site a{color:#b9c6dc;display:block;padding:3px 0;font-size:.9rem}
footer.site a:hover{color:#fff}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px}
.copy{border-top:1px solid rgba(255,255,255,.12);margin-top:34px;padding:16px 0;text-align:center;font-size:.85rem}
.socials{display:flex;gap:10px;margin-top:12px}
.socials a{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;padding:0}

/* toast + modal (shared) */
.toast-host{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#132029;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:.9rem;animation:tin .25s}
.toast-success{background:#146c3a}.toast-error{background:#b32020}.toast-info{background:#0b5cab}
.toast.out{opacity:0;transform:translateX(20px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,25,20,.55);z-index:9000;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:min .2s}
.modal.lg{width:min(950px,100%)} .modal.xl{width:min(1150px,100%)}
@keyframes min{from{transform:translateY(14px);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:1.05rem}
.modal-body{padding:20px;overflow:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.icon-btn{background:none;border:0;font-size:1.05rem;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px}
.icon-btn:hover{background:#f0f3f5}

/* responsive */
@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .gal{grid-template-columns:repeat(3,1fr)} .fgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:1260px){
  .nav{justify-content:space-between}
  .nav>nav{display:none}
  .burger{display:block}
  .mobile-menu{display:flex;flex-direction:column;max-height:0;overflow:hidden;background:var(--brand-soft);
    border-bottom:1px solid var(--line);transition:max-height .3s ease}
  .mobile-menu.open{max-height:640px;overflow-y:auto}
  .mobile-menu a{padding:13px 20px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600;font-size:.95rem}
  .mobile-menu a:hover,.mobile-menu a.active{background:#fff;color:var(--brand)}
  .mobile-menu a.btn{margin:10px 20px;padding:10px 14px;border:0;color:#fff!important}
  .brand{max-width:none}
  .topbar .container{flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:9px;padding-bottom:9px}
  .topbar .tb-links{justify-content:center}
}
@media(max-width:760px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .gal{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .section{padding:44px 0}
  .hero{height:auto;min-height:440px;padding:60px 0}
  .slide{position:relative;display:none}.slide.on{display:grid}
}

/* ============ Print / PDF: A4 documents, ID cards, receipts, result sheets ============ */
@page{size:A4;margin:12mm}
.print-root{font-family:'Segoe UI','Noto Sans Bengali',Arial,sans-serif;color:#111}
.a4{width:210mm;min-height:296mm;padding:12mm;margin:0 auto 10mm;background:#fff;box-shadow:0 3px 16px rgba(0,0,0,.15)}
.doc-head{display:flex;gap:14px;align-items:center;border-bottom:3px double #0b6b4f;padding-bottom:10px;margin-bottom:14px}
.doc-head .lg{width:74px;height:74px;object-fit:contain;border-radius:8px;background:#0b6b4f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem}
.doc-head .t{flex:1;text-align:center}
.doc-head h1{margin:0;font-size:22px;color:#0b6b4f;letter-spacing:.3px}
.doc-head p{margin:1px 0;font-size:11.5px;color:#333}
.doc-title{text-align:center;margin:8px 0 14px}
.doc-title span{display:inline-block;border:1.5px solid #0b6b4f;border-radius:20px;padding:4px 22px;font-weight:700;font-size:13px;color:#0b6b4f;text-transform:uppercase;letter-spacing:1px}
.ptbl{width:100%;border-collapse:collapse;font-size:11.6px}
.ptbl th,.ptbl td{border:1px solid #94a3ac;padding:5px 7px;text-align:left}
.ptbl th{background:#e8f2ee;font-weight:700}
.ptbl td.c,.ptbl th.c{text-align:center}
.ptbl td.r{text-align:right}
.kv{width:100%;border-collapse:collapse;font-size:12px}
.kv td{padding:4px 6px;vertical-align:top}
.kv td.k{width:130px;font-weight:600;color:#33424c}
.kv td.k::after{content:':';float:right}
.sign-row{display:flex;justify-content:space-between;margin-top:66px;font-size:11.5px;text-align:center}
.sign-row div{border-top:1px dotted #333;padding-top:4px;min-width:150px}
.stu-photo{width:28mm;height:33mm;object-fit:cover;border:1px solid #94a3ac;background:#eef2f5;display:grid;place-items:center;font-size:10px;color:#7b8891}
.doc-foot{margin-top:12px;border-top:1px solid #cbd5da;padding-top:6px;font-size:10px;color:#667;display:flex;justify-content:space-between}
.watermark{position:absolute;inset:0;display:grid;place-items:center;opacity:.05;font-size:90px;font-weight:800;transform:rotate(-28deg);pointer-events:none}

/* ---- ID card: CR80 standard 85.6mm x 54mm (portrait 54x85.6 used here) ---- */
.idsheet{display:flex;flex-wrap:wrap;gap:6mm;justify-content:flex-start}
.idcard{width:54mm;height:85.6mm;border-radius:4mm;overflow:hidden;position:relative;background:#fff;
  border:1px solid #cbd5da;font-size:8px;page-break-inside:avoid;break-inside:avoid;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.id-top{background:linear-gradient(135deg,#0b6b4f,#0e8a66);color:#fff;padding:3mm 2mm;text-align:center}
.id-top img,.id-top .lgph{width:9mm;height:9mm;border-radius:50%;object-fit:cover;background:#fff;color:#0b6b4f;display:grid;place-items:center;margin:0 auto 1mm;font-weight:800;font-size:9px}
.id-top b{display:block;font-size:8.4px;line-height:1.2}
.id-top small{font-size:6px;opacity:.9;display:block;line-height:1.2}
.idcard{display:flex;flex-direction:column}
.id-photo{width:20mm;height:24mm;object-fit:cover;border:2px solid #0b6b4f;border-radius:2mm;margin:2mm auto 1mm;display:block;background:#eef2f5}
.id-name{text-align:center;font-weight:800;font-size:9px;color:#0b3;color:#0b6b4f;margin:0 2mm}
.id-desig{text-align:center;font-size:7px;color:#556;margin-bottom:1.5mm}
.id-rows{padding:0 3mm;font-size:6.6px;line-height:1.42}
.id-rows div{display:flex;justify-content:space-between;gap:2mm;border-bottom:.3px dotted #b9c6cd}
.id-rows span:first-child{color:#556;font-weight:600}
.id-rows span:last-child{font-weight:700;text-align:right}
.id-bottom{background:#0b6b4f;color:#fff;text-align:center;font-size:5.6px;padding:1.2mm;margin-top:1mm}
.id-qr{margin:1mm auto 0;width:12mm;height:12mm;background:#fff;display:block}
.id-qr img,.id-qr canvas{width:12mm!important;height:12mm!important;display:block}
.id-spacer{flex:1}
.id-back{padding:3mm;font-size:6.4px;line-height:1.45}
.id-back h5{margin:0 0 1mm;font-size:8px;color:#0b6b4f;text-align:center;text-transform:uppercase}
.id-back ol{margin:0 0 2mm;padding-left:3.5mm}
.id-sign{margin-top:3mm;text-align:right;font-size:6px}
.id-sign i{display:block;border-top:.5px solid #333;width:22mm;margin-left:auto;padding-top:.5mm;font-style:normal}

/* ---- receipt ---- */
.receipt{width:190mm;background:#fff;padding:8mm;border:1px solid #cbd5da;margin:0 auto 6mm;page-break-inside:avoid}
.rc-no{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:8px}
.amt-box{border:2px solid #0b6b4f;border-radius:6px;padding:6px 12px;display:inline-block;font-weight:800;color:#0b6b4f;font-size:15px}

/* ---- printing rules ---- */
.print-toolbar{position:sticky;top:0;background:#0c2f25;color:#fff;padding:10px 16px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;z-index:50}
.print-toolbar b{flex:1}
@media print{
  *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}

  .print-toolbar,.no-print{display:none!important}
  body{background:#fff!important;margin:0}
  .a4{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0;page-break-after:always}
  .a4:last-child{page-break-after:auto}

/* utils.js — helpers shared by public site + admin panel */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ---------- XSS-safe helpers ---------- */
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(v) { return esc(v); }

/* ---------- ids / numbers ---------- */
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n, l = 4) => String(n).padStart(l, '0');
const money = n => '৳' + Number(n || 0).toLocaleString('en-BD', { maximumFractionDigits: 2 });
const num = n => Number(n || 0);

/* ---------- dates ---------- */
const today = () => new Date().toISOString().slice(0, 10);
function fmtDate(d) {
  if (!d) return '-';
  const x = new Date(d); if (isNaN(x)) return d;
  return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function bnNum(n) {
  const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
  return String(n).padStart(2, '0').split('').map(d => digits[+d] ?? d).join('');
}

/* ---------- validation ---------- */
const V = {
  required: v => (v !== null && v !== undefined && String(v).trim() !== '') || 'This field is required',
  email: v => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || 'Invalid email address',
  phone: v => !v || /^[0-9+\-\s()]{6,20}$/.test(v) || 'Invalid phone number',
  minLen: n => v => (String(v || '').length >= n) || `Minimum ${n} characters`,
  numberMin: n => v => (Number(v) >= n) || `Must be ≥ ${n}`,
};
function validate(obj, rules) {
  const errors = {};
  for (const [field, list] of Object.entries(rules)) {
    for (const rule of list) {
      const r = rule(obj[field]);
      if (r !== true) { errors[field] = r; break; }
    }
  }
  return { ok: Object.keys(errors).length === 0, errors };
}

/* ---------- toast ---------- */
function toast(msg, type = 'success') {
  let host = $('#toastHost');
  if (!host) { host = document.createElement('div'); host.id = 'toastHost'; host.className = 'toast-host'; document.body.appendChild(host); }
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}

/* ---------- modal ---------- */
function modal({ title, body, size = '', onOpen, footer = '' }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${size}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
  </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.hasAttribute('data-close')) close(); });
  document.addEventListener('keydown', function esckey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esckey); } });
  onOpen && onOpen(wrap, close);
  return { el: wrap, close };
}
function confirmDlg(msg) {
  return new Promise(res => {
    const m = modal({
      title: 'Please confirm', body: `<p class="mb0">${esc(msg)}</p>`,
      footer: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-yes>Yes, continue</button>`,
      onOpen: (w, close) => {
        w.querySelector('[data-yes]').onclick = () => { close(); res(true); };
        w.addEventListener('click', e => { if (e.target === w || e.target.hasAttribute('data-close')) res(false); });
      }
    });
    void m;
  });
}

/* ============================================================
   ⚙️ CONFIG — Cloudflare D1 (production database) + Cloudinary (image storage)
   admin.html এ যে APP_CONFIG বসিয়েছেন, এখানে adminKey বাদে বাকিটা হুবহু একই রাখুন।
   ⚠️ এখানে কখনোই adminKey বসাবেন না — এই ফাইল পাবলিক, যে কেউ সোর্স দেখতে পারে।
   বিস্তারিত গাইড: BACKEND.md
   ============================================================ */
const APP_CONFIG = {
  apiBase: '/api',
  adminKey: '', // পাবলিক সাইট — খালি রাখুন
  cloudinary: {
    cloudName: 'y2jlujeh',
    uploadPreset: 'ccdsbd',
    folder: 'school'
  }
};
function cloudinaryReady() {
  const c = APP_CONFIG.cloudinary;
  return !!(c.cloudName && c.cloudName !== 'CHANGE_ME_CLOUD_NAME' && c.uploadPreset && c.uploadPreset !== 'CHANGE_ME_UPLOAD_PRESET');
}
function resizeImageToBlob(file, maxW = 600) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) return resolve(file);
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
      };
      img.onerror = () => resolve(file);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const CL_TAG_ASSET = 'school_asset';   // admin.html এর সাথে হুবহু একই ট্যাগ
async function cloudinaryUpload(fileOrBlob, { resourceType = 'image', publicIdPrefix = '', tags = [CL_TAG_ASSET] } = {}) {
  const { cloudName, uploadPreset, folder } = APP_CONFIG.cloudinary;
  const fd = new FormData();
  fd.append('file', fileOrBlob);
  fd.append('upload_preset', uploadPreset);
  if (folder) fd.append('folder', folder);
  if (publicIdPrefix) fd.append('public_id', publicIdPrefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  if (tags && tags.length) fd.append('tags', tags.join(','));
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`, { method: 'POST', body: fd });
  if (!res.ok) throw new Error('Cloudinary আপলোড ব্যর্থ (' + res.status + ')');
  const json = await res.json();
  return json.secure_url;
}
async function uploadImage(file, maxW = 600, prefix = 'img') {
  if (!file) return '';
  if (cloudinaryReady()) {
    try { const blob = await resizeImageToBlob(file, maxW); return await cloudinaryUpload(blob, { publicIdPrefix: prefix, tags: [CL_TAG_ASSET] }); }
    catch (e) { console.warn('Cloudinary upload failed, falling back to local image storage:', e); }
  }
  return fileToDataURL(file, maxW);
}

/* ---------- file → dataURL (images stored as base64) ---------- */
function fileToDataURL(file, maxW = 600) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      if (!file.type.startsWith('image/')) return resolve(fr.result);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- CSV ---------- */
function toCSV(rows, headers) {
  const cols = headers || Object.keys(rows[0] || {});
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n');
}
function parseCSV(text) {
  const rows = []; let cur = [], val = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { val += '"'; i++; }
      else if (ch === '"') inQ = false;
      else val += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { cur.push(val); val = ''; }
    else if (ch === '\n') { cur.push(val); rows.push(cur); cur = []; val = ''; }
    else if (ch !== '\r') val += ch;
  }
  if (val !== '' || cur.length) { cur.push(val); rows.push(cur); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(c => c !== '')).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
}
function download(filename, content, mime = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  if (pct >= 60) return { g: 'A-', p: 3.50 };

/* db.js — storage abstraction layer.
   Default adapter: LocalStorageAdapter (works offline, zero setup).
   Swap in SupabaseAdapter / FirebaseAdapter later without touching modules:
   every module only ever calls  DB.list / get / insert / update / remove / query.
*/

const COLLECTIONS = [
  'users', 'school', 'students', 'teachers', 'admissions', 'classes', 'sections', 'subjects',
  'feeHeads', 'payments', 'exams', 'results', 'notices', 'events',
  'albums', 'photos', 'videos', 'banners', 'counters'
];

/* ---- kept for reference / emergency offline fallback ---- */
class LocalStorageAdapter {
  constructor(ns = 'sunrise_v1') { this.ns = ns; }
  key(c) { return `${this.ns}:${c}`; }
  _read(c) { try { return JSON.parse(localStorage.getItem(this.key(c))) || []; } catch { return []; } }
  _write(c, rows) { localStorage.setItem(this.key(c), JSON.stringify(rows)); }

  async list(c) { const rows = this._read(c); return c === 'classes' ? rows.slice().sort((a, b) => (a.numeric ?? 0) - (b.numeric ?? 0)) : rows; }
  async get(c, id) { return this._read(c).find(r => r.id === id) || null; }
  async insert(c, doc) {
    const rows = this._read(c);
    const row = { id: doc.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...doc };
    rows.push(row); this._write(c, rows); return row;
  }
  async update(c, id, patch) {
    const rows = this._read(c); const i = rows.findIndex(r => r.id === id);
    if (i < 0) throw new Error('Record not found');
    rows[i] = { ...rows[i], ...patch, updatedAt: new Date().toISOString() };
    this._write(c, rows); return rows[i];
  }
  async remove(c, id) {
    const rows = this._read(c).filter(r => r.id !== id); this._write(c, rows); return true;
  }
  async query(c, predicate) { return this._read(c).filter(predicate); }
  async bulkInsert(c, docs) { const out = []; for (const d of docs) out.push(await this.insert(c, d)); return out; }
  async replaceAll(c, rows) { this._write(c, rows); }
  async dump() { const o = {}; for (const c of COLLECTIONS) o[c] = this._read(c); return o; }
  async restore(obj) { for (const c of COLLECTIONS) if (obj[c]) this._write(c, obj[c]); }
  async wipe() { for (const c of COLLECTIONS) localStorage.removeItem(this.key(c)); }
}

/* ---- D1Adapter — talks to Cloudflare Pages Functions (functions/api/[[path]].js),
   which reads/writes the shared Cloudflare D1 database. No adminKey here (public site),
   so writes are limited server-side to public-safe collections (e.g. admissions). ---- */
class D1Adapter {
  constructor({ apiBase = '/api', adminKey = '' } = {}) {
    this.apiBase = apiBase.replace(/\/$/, '');
    this.adminKey = adminKey;
    this._cache = {};
    this._inflight = {};
    this._localNs = 'sunrise_v1_cache';
  }
  _headers() {
    const h = { 'Content-Type': 'application/json' };
    if (this.adminKey) h['X-Admin-Key'] = this.adminKey;
    return h;
  }
  async _err(res, what) {
    let msg = `${what} failed (${res.status})`;
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
    return msg;
  }
  _cacheLocal(c, rows) { try { localStorage.setItem(`${this._localNs}:${c}`, JSON.stringify(rows)); } catch (_) {} }
  _readLocalCache(c) { try { return JSON.parse(localStorage.getItem(`${this._localNs}:${c}`)) || []; } catch (_) { return []; } }
  invalidate(c) { delete this._cache[c]; }
  invalidateAll() { this._cache = {}; }

  async _fetchList(c) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}`, { headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, `লোড (${c})`));
    let rows = await res.json();
    if (c === 'classes') rows = rows.slice().sort((a, b) => (a.numeric ?? 0) - (b.numeric ?? 0));
    this._cacheLocal(c, rows);
    return rows;
  }
  async list(c) {
    if (this._cache[c]) return this._cache[c];
    if (!this._inflight[c]) {
      this._inflight[c] = this._fetchList(c)
        .then(rows => { this._cache[c] = rows; delete this._inflight[c]; return rows; })
        .catch(err => {
          delete this._inflight[c];
          const fallback = this._readLocalCache(c);
          if (fallback.length || navigator.onLine === false) { console.warn('DB.list offline fallback:', c, err.message); return fallback; }
          throw err;
        });
    }
    return this._inflight[c];
  }
  async get(c, id) {
    const cached = (this._cache[c] || []).find(r => r.id === id);
    if (cached) return cached;
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { headers: this._headers() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(await this._err(res, `লোড (${c}/${id})`));
    return res.json();
  }
  async insert(c, doc) {
    const row = { id: doc.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...doc };
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}`, { method: 'POST', headers: this._headers(), body: JSON.stringify(row) });
    if (!res.ok) throw new Error(await this._err(res, `সংরক্ষণ (${c})`));
    this.invalidate(c);
    return res.json();
  }
  async update(c, id, patch) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { method: 'PATCH', headers: this._headers(), body: JSON.stringify(patch) });
    if (!res.ok) throw new Error(await this._err(res, `আপডেট (${c}/${id})`));
    this.invalidate(c);
    return res.json();
  }
  async remove(c, id) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, `মুছে ফেলা (${c}/${id})`));
    this.invalidate(c);
    return true;
  }
  async query(c, predicate) { return (await this.list(c)).filter(predicate); }
  async bulkInsert(c, docs) {
    const rows = docs.map(d => ({ id: d.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...d }));
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/bulk`, { method: 'POST', headers: this._headers(), body: JSON.stringify(rows) });
    if (!res.ok) throw new Error(await this._err(res, `বাল্ক সংরক্ষণ (${c})`));
    this.invalidate(c);
    return res.json();
  }
  async replaceAll(c, rows) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/replace-all`, { method: 'POST', headers: this._headers(), body: JSON.stringify(rows) });
    if (!res.ok) throw new Error(await this._err(res, `প্রতিস্থাপন (${c})`));
    this.invalidate(c);
  }
  async dump() {
    const res = await fetch(`${this.apiBase}/_dump`, { headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, 'ব্যাকআপ তৈরি'));
    return res.json();
  }
  async restore(obj) {
    const res = await fetch(`${this.apiBase}/_restore`, { method: 'POST', headers: this._headers(), body: JSON.stringify(obj) });
    if (!res.ok) throw new Error(await this._err(res, 'পুনরুদ্ধার'));
    this.invalidateAll();
  }
  async wipe() {
    const res = await fetch(`${this.apiBase}/_wipe`, { method: 'POST', headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, 'রিসেট'));
    this.invalidateAll();
  }
}

const DB = new D1Adapter(APP_CONFIG);

/* ---- sequential counters: Student ID, Receipt No ---- */
async function nextSeq(name, start = 1) {
  const rows = await DB.list('counters');
  let row = rows.find(r => r.name === name);
  if (!row) row = await DB.insert('counters', { name, value: start - 1 });
  const val = Number(row.value) + 1;
  await DB.update('counters', row.id, { value: val });
  return val;
}

/* auth.js — authentication & route protection.
   Passwords are never stored in plain text: PBKDF2-SHA256 (150k iters) via WebCrypto,
   with a per-user random salt. Sessions are signed-ish tokens with expiry.
*/

const SESSION_KEY = 'sunrise_v1:session';
const enc = new TextEncoder();

async function pbkdf2(password, saltB64, iters = 150000) {
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' }, key, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
function randB64(n = 16) {
  const a = crypto.getRandomValues(new Uint8Array(n));
  return btoa(String.fromCharCode(...a));
}
async function hashPassword(password) {
  const salt = randB64(16);
  return { salt, hash: await pbkdf2(password, salt), iters: 150000 };
}
async function verifyPassword(password, user) {
  if (!user?.salt) return false;
  const h = await pbkdf2(password, user.salt, user.iters || 150000);
  // constant-time-ish compare
  if (h.length !== user.hash.length) return false;
  let diff = 0; for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ user.hash.charCodeAt(i);
  return diff === 0;
}

const Auth = {
  async register({ name, email, username, password, role = 'admin' }) {
    const users = await DB.list('users');
    if (users.some(u => u.email?.toLowerCase() === email.toLowerCase()))
      throw new Error('This email is already registered');
    const cred = await hashPassword(password);
    return DB.insert('users', { name, email: email.toLowerCase(), username, role, active: true, ...cred });
  },

  async login(identifier, password, remember = false) {
    const id = String(identifier || '').toLowerCase().trim();
    const users = await DB.list('users');
    const user = users.find(u => u.email?.toLowerCase() === id || u.username?.toLowerCase() === id);
    // uniform failure message — no user enumeration
    if (!user || !user.active || !(await verifyPassword(password, user)))
      throw new Error('Invalid credentials');
    const ttl = remember ? 30 * 24 * 3600e3 : 8 * 3600e3;
    const session = { uid: user.id, role: user.role, name: user.name, email: user.email, exp: Date.now() + ttl, tok: randB64(24) };
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
    await DB.update('users', user.id, { lastLogin: new Date().toISOString() });
    return session;
  },

  session() {
    const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    try {
      const s = JSON.parse(raw);
      if (!s.exp || s.exp < Date.now()) { Auth.logout(); return null; }
      return s;
    } catch { return null; }
  },

  isLoggedIn() { return !!Auth.session(); },
  can(role) { const s = Auth.session(); return !!s && (s.role === 'admin' || s.role === role); },

  logout() {
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
  },

  async changePassword(userId, oldPw, newPw) {
    const u = await DB.get('users', userId);
    if (!u || !(await verifyPassword(oldPw, u))) throw new Error('Current password is incorrect');
    if (String(newPw).length < 6) throw new Error('New password must be at least 6 characters');
    return DB.update('users', userId, await hashPassword(newPw));
  },

  /* Forgot password: offline demo issues a reset token the admin can use.
     With Supabase/Firebase, call their resetPasswordForEmail() instead. */
  async requestReset(email) {
    const users = await DB.list('users');
    const u = users.find(x => x.email?.toLowerCase() === String(email).toLowerCase());
    if (!u) return null;                       // silent — no enumeration
    const token = randB64(9).replace(/[^a-zA-Z0-9]/g, '').slice(0, 8).toUpperCase();
    await DB.update('users', u.id, { resetToken: token, resetExp: Date.now() + 30 * 60e3 });
    return token;
  },
  async resetWithToken(email, token, newPw) {
    const users = await DB.list('users');
    const u = users.find(x => x.email?.toLowerCase() === String(email).toLowerCase());
    if (!u || u.resetToken !== token || !u.resetExp || u.resetExp < Date.now())
      throw new Error('Invalid or expired reset token');
    await DB.update('users', u.id, { ...(await hashPassword(newPw)), resetToken: null, resetExp: null });
    return true;
  }
};

  return true;
}

/**
 * DataTable — search + filters + sort + pagination + row actions, all client-side.
 * cols: [{key,label,render?,className?,sortable?}]
 */
class DataTable {
  constructor(host, { cols, rows, pageSize = 10, searchKeys = [], empty = 'কোনো তথ্য নেই', onRow }) {
    this.host = host; this.cols = cols; this.all = rows; this.pageSize = pageSize;
    this.searchKeys = searchKeys; this.empty = empty; this.onRow = onRow;
    this.page = 1; this.q = ''; this.filters = {}; this.sort = null;
    this.render();
  }
  setRows(rows) { this.all = rows; this.page = 1; this.render(); }
  setFilter(k, v) { this.filters[k] = v; this.page = 1; this.render(); }
  setQuery(q) { this.q = String(q || '').toLowerCase().trim(); this.page = 1; this.render(); }
  filtered() {
    let rows = this.all.filter(r => {
      for (const [k, v] of Object.entries(this.filters)) if (v && String(r[k] ?? '') !== String(v)) return false;
      if (!this.q) return true;
      return this.searchKeys.some(k => String(r[k] ?? '').toLowerCase().includes(this.q));
    });
    if (this.sort) {
      const { key, dir } = this.sort;
      rows = rows.slice().sort((a, b) => {
        const x = a[key] ?? '', y = b[key] ?? '';
        const n = (!isNaN(parseFloat(x)) && !isNaN(parseFloat(y))) ? parseFloat(x) - parseFloat(y) : String(x).localeCompare(String(y));
        return dir === 'asc' ? n : -n;
      });
    }
    return rows;
  }
  render() {
    const rows = this.filtered();
    const pages = Math.max(1, Math.ceil(rows.length / this.pageSize));
    this.page = Math.min(this.page, pages);
    const view = rows.slice((this.page - 1) * this.pageSize, this.page * this.pageSize);
    this.host.innerHTML = view.length ? `
      <div class="table-wrap"><table class="tbl">
        <thead><tr>${this.cols.map(c => `<th ${c.sortable !== false ? `data-sort="${esc(c.key)}" style="cursor:pointer"` : ''}>${esc(c.label)}${this.sort?.key === c.key ? (this.sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
        <tbody>${view.map(r => `<tr data-id="${esc(r.id)}">${this.cols.map(c =>
          `<td class="${c.className || ''}">${c.render ? c.render(r) : esc(r[c.key] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="pager">
        <button ${this.page === 1 ? 'disabled' : ''} data-p="${this.page - 1}">‹ Prev</button>
        ${Array.from({ length: pages }, (_, i) => i + 1)
          .filter(p => p === 1 || p === pages || Math.abs(p - this.page) <= 2)
          .map((p, i, arr) => (i > 0 && p - arr[i - 1] > 1 ? '<button disabled>…</button>' : '') +
            `<button class="${p === this.page ? 'on' : ''}" data-p="${p}">${p}</button>`).join('')}
        <button ${this.page === pages ? 'disabled' : ''} data-p="${this.page + 1}">Next ›</button>
        <span class="muted" style="align-self:center;font-size:.83rem;margin-left:8px">${rows.length} টি রেকর্ড</span>
      </div>` : `<div class="empty"><span class="ic">📭</span>${esc(this.empty)}</div>`;

    $$('[data-p]', this.host).forEach(b => b.onclick = () => { this.page = +b.dataset.p; this.render(); });
    $$('[data-sort]', this.host).forEach(th => th.onclick = () => {
      const key = th.dataset.sort;
      this.sort = this.sort?.key === key ? { key, dir: this.sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
      this.render();
    });
    if (this.onRow) $$('tbody tr', this.host).forEach(tr => this.onRow(tr, this.all.find(r => r.id === tr.dataset.id)));
  }
}

/** Build a form from a field spec; returns {html, read(el)} */
function formHTML(fields, data = {}) {
  const f = fld => {
    const v = data[fld.name] ?? fld.value ?? '';
    const common = `class="input" name="${esc(fld.name)}" id="fld_${esc(fld.name)}" ${fld.required ? 'required' : ''} ${fld.attrs || ''}`;
    let inner;
    if (fld.type === 'select')
      inner = `<select ${common}>${(fld.options || []).map(o => {
        const [val, lab] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
    else if (fld.type === 'textarea')
      inner = `<textarea ${common} rows="${fld.rows || 3}">${esc(v)}</textarea>`;
    else if (fld.type === 'file')
      inner = `<input type="file" ${common} accept="${fld.accept || 'image/*'}">
        ${v ? `<img src="${esc(v)}" style="margin-top:8px;max-height:80px;border-radius:8px">` : ''}`;
    else if (fld.type === 'checkbox')
      inner = `<label class="checkbox"><input type="checkbox" name="${esc(fld.name)}" id="fld_${esc(fld.name)}" ${v ? 'checked' : ''}> ${esc(fld.hint || '')}</label>`;
    else inner = `<input type="${fld.type || 'text'}" ${common} value="${esc(v)}" placeholder="${esc(fld.placeholder || '')}">`;
    return `<div class="field" style="${fld.full ? 'grid-column:1/-1' : ''}">
      ${fld.type === 'checkbox' ? '' : `<label for="fld_${esc(fld.name)}">${esc(fld.label)}${fld.required ? ' *' : ''}</label>`}
      ${inner}<span class="err" data-err="${esc(fld.name)}"></span></div>`;
  };
  return `<div class="row">${fields.map(f).join('')}</div>`;
}
function readForm(root, fields) {
  const out = {};
  for (const fld of fields) {
    const el = root.querySelector(`[name="${fld.name}"]`);
    if (!el) continue;
    out[fld.name] = fld.type === 'checkbox' ? el.checked : (fld.type === 'number' ? Number(el.value) : el.value.trim?.() ?? el.value);
  }
  return out;
}
function showErrors(root, errors) {
  $$('[data-err]', root).forEach(s => s.textContent = '');
  for (const [k, msg] of Object.entries(errors)) {
    const s = root.querySelector(`[data-err="${k}"]`); if (s) s.textContent = msg;
  }
}
const searchBox = (id, ph = 'Search…') =>
  `<div class="field"><input class="input" id="${id}" placeholder="🔍 ${esc(ph)}"></div>`;
const bindSearch = (el, fn) => { if (el) el.oninput = debounce(() => fn(el.value), 220); };

const rnd = a => a[Math.floor(Math.random() * a.length)];

async function seedIfEmpty() {
  // Always ensure all CLASSES exist with correct order (fixes existing browser data missing/misordered classes, e.g. Nursery)
  try {
    const existingClasses = await DB.list('classes');
    for (const name of CLASSES) {
      const idx = CLASSES.indexOf(name);
      const found = existingClasses.find(c => c.name === name);
      if (!found) {
        await DB.insert('classes', { name, numeric: idx });
      } else if (found.numeric !== idx) {
        await DB.update('classes', found.id, { numeric: idx });
      }
    }
  } catch (e) { console.warn('[seed] class ensure failed', e); }

  // Always ensure every class has sections (fixes classes added later, e.g. Nursery, missing A/B/C sections)
  try {
    const allClasses = await DB.list('classes');
    const allSections = await DB.list('sections');
    for (const c of allClasses) {
      if (!allSections.some(sec => sec.classId === c.id)) {
        for (const sName of SECTIONS) await DB.insert('sections', { classId: c.id, name: sName });
      }
    }
  } catch (e) { console.warn('[seed] section ensure failed', e); }

  const school = await DB.list('school');
  if (school.length) return false;

  await DB.insert('school', DEFAULT_SCHOOL);
  await Auth.register({ name: 'School Admin', email: 'admin@school.com', username: 'admin', password: 'admin123', role: 'admin' });

  const classRows = await DB.list('classes');
  for (const c of classRows) for (const s of SECTIONS) await DB.insert('sections', { classId: c.id, name: s });
  for (const c of classRows) {
    const list = c.numeric >= 9 ? SUBJECTS_SR : SUBJECTS_JR;
    for (const s of list) await DB.insert('subjects', {
      classId: c.id, name: s, fullMarks: 100, passMarks: 33,
      hasMcq: c.numeric >= 6, hasPractical: /Physics|Chemistry|Biology|Science|ICT/.test(s)
    });
  }
  for (const f of FEE_HEADS) await DB.insert('feeHeads', f);

  for (const [name, designation, subject, department, qualification, joiningDate, phone, email] of TEACHERS)
    await DB.insert('teachers', { name, designation, subject, department, qualification, joiningDate, phone, email, photo: '', status: 'Active' });

  // students spread across classes
  let sid = 0;
  const sessions = ['2026'];
  for (const st of STUDENT_NAMES) {
    sid++;
    const cls = classRows[Math.floor(Math.random() * classRows.length)];
    const secRows = await DB.query('sections', r => r.classId === cls.id);
    const sec = rnd(secRows);
    await DB.insert('students', {
      studentId: 'STD' + String(1000 + sid),
      admissionNo: 'ADM' + new Date().getFullYear() + String(100 + sid),
      name: st[0], fatherName: st[1], motherName: st[2], gender: st[3], bloodGroup: st[4],
      dob: `20${10 + (sid % 8)}-0${1 + (sid % 9)}-1${sid % 9}`,
      classId: cls.id, sectionId: sec?.id || '', roll: String(1 + (sid % 30)),
      session: rnd(sessions),
      phone: '+88017' + String(10000000 + sid * 137).slice(0, 8),
      guardianPhone: '+88018' + String(10000000 + sid * 271).slice(0, 8),
      address: 'Dhanmondi, Dhaka', admissionDate: '2026-01-05',
      photo: '', status: 'Active', religion: 'Islam'
    });
  }

  // exams
  for (const e of [['Half Yearly Examination', '2026'], ['Annual Examination', '2026']])
    await DB.insert('exams', { name: e[0], session: e[1] });

  for (const [title, description, date, published] of NOTICES)
    await DB.insert('notices', { title, description, date, published, attachment: '', attachmentName: '' });

  for (const [title, date, time, location, description] of EVENTS)
    await DB.insert('events', { title, date, time, location, description, image: '' });

  const albums = [['Annual Sports Day', 'বার্ষিক ক্রীড়া প্রতিযোগিতার নির্বাচিত মুহূর্ত'], ['Science Fair', 'বিজ্ঞান মেলার প্রকল্প প্রদর্শনী'], ['Campus Life', 'আমাদের ক্যাম্পাস ও শ্রেণিকক্ষ']];
  for (const [name, desc] of albums) await DB.insert('albums', { name, description: desc, cover: '' });

  // a few payments so dashboard/reports are meaningful
  const students = await DB.list('students');
  const heads = await DB.list('feeHeads');
  let rc = 0;
  for (const s of students.slice(0, 14)) {
    rc++;
    const head = rnd(heads.filter(h => h.amount > 0));
    const total = head.amount, paid = Math.random() > 0.25 ? total : Math.round(total * 0.5);
    await DB.insert('payments', {
      receiptNo: 'RCP' + String(1000 + rc),
      studentId: s.id, feeHeadId: head.id, feeType: head.name,
      month: '', session: s.session, total, paid, due: total - paid,
      method: rnd(['Cash', 'bKash', 'Nagad', 'Bank']),
      date: today(), note: '', collectedBy: 'School Admin'
    });
  }
  await DB.insert('counters', { name: 'student', value: 1000 + sid });
  await DB.insert('counters', { name: 'receipt', value: 1000 + rc });
  await DB.insert('counters', { name: 'admission', value: 100 + sid });
  void uid;
  return true;
}

/* ---------------- Public result search ---------------- */
async function publicResultSearch({ query, classId, roll, examId } = {}) {
  const q = String(query || '').trim().toLowerCase();
  const rollQ = String(roll || '').trim().toLowerCase();
  const students = await DB.list('students');
  let stu;
  if (classId && rollQ) {
    stu = students.find(s => s.classId === classId && String(s.roll).toLowerCase() === rollQ);
    if (!stu) throw new Error('এই শ্রেণি ও রোল নম্বর দিয়ে কোনো শিক্ষার্থী পাওয়া যায়নি');
  } else if (q) {
    stu = students.find(s =>
      s.studentId?.toLowerCase() === q || s.admissionNo?.toLowerCase() === q || String(s.roll).toLowerCase() === q);
    if (!stu) throw new Error('এই তথ্য দিয়ে কোনো শিক্ষার্থী পাওয়া যায়নি');
  } else {
    throw new Error('শ্রেণি ও রোল, অথবা Student ID / Admission No দিন');
  }
  const results = await DB.query('results', r => r.studentId === stu.id && (!examId || r.examId === examId));
  if (!results.length) throw new Error('এই শিক্ষার্থীর প্রকাশিত ফলাফল নেই');
  const published = results.filter(r => r.published);
  if (!published.length) throw new Error('ফলাফল এখনো প্রকাশিত হয়নি');
  return { student: stu, results: published };
}

function resultCardHTML(student, res, subjects, exam, cls, sec) {
  const rows = (res.marks || []).map(m => {
    const sub = subjects.find(s => s.id === m.subjectId);
    const total = num(m.written) + num(m.mcq) + num(m.practical);
    const g = gradeOf(total / (sub?.fullMarks || 100) * 100);
    return `<tr><td>${esc(sub?.name || '-')}</td><td class="c">${sub?.fullMarks || 100}</td>
      <td class="c">${num(m.written)}</td><td class="c">${num(m.mcq)}</td><td class="c">${num(m.practical)}</td>
      <td class="c"><b>${total}</b></td><td class="c">${g.g}</td><td class="c">${g.p.toFixed(2)}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Subject</th><th>Full</th><th>Written</th><th>MCQ</th><th>Practical</th><th>Total</th><th>Grade</th><th>GP</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:#f2f7f5;font-weight:700">
      <td colspan="5">Total: ${res.totalMarks} • Average: ${res.average?.toFixed(2)}</td>
      <td class="c">GPA ${res.gpa?.toFixed(2)}</td><td class="c">${res.grade}</td><td class="c">${res.status}</td></tr></tfoot>
  </table></div>
  <p class="muted" style="margin-top:10px">${esc(exam?.name || '')} • Session ${esc(res.session)} • Class ${esc(cls || '')} ${esc(sec || '')} • Roll ${esc(student.roll)} • Position ${res.position || '-'}</p>`;
}

const PRINT_CSS_PLACEHOLDER = "/* ================= Public Website Theme ================= */\n:root{\n  --brand:#0b6b4f; --brand-2:#0e8a66; --brand-dark:#074a37; --accent:#f5a623;\n  --ink:#132029; --muted:#5d6b76; --line:#e4e9ee; --bg:#f6f8fa; --card:#fff;\n  --radius:14px; --shadow:0 2px 10px rgba(16,40,60,.07); --shadow-lg:0 12px 34px rgba(16,40,60,.14);\n  --max:1180px; --font:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',Roboto,Arial,sans-serif;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px}\nimg{max-width:100%;display:block}\na{color:var(--brand);text-decoration:none}\nh1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-weight:700;letter-spacing:-.2px}\nh1{font-size:clamp(1.9rem,4vw,3rem)}\nh2{font-size:clamp(1.4rem,2.6vw,2rem)}\np{margin:0 0 1rem}\n.mb0{margin-bottom:0}\n.container{max-width:var(--max);margin:0 auto;padding:0 18px}\n.section{padding:64px 0}\n.section.alt{background:#fff}\n.center{text-align:center}\n.muted{color:var(--muted)}\n.sec-head{text-align:center;max-width:720px;margin:0 auto 38px}\n.sec-head .kicker{color:var(--brand-2);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:.76rem}\n.sec-head h2{margin:.35rem 0 .5rem}\n.sec-head p{color:var(--muted);margin:0}\n\n/* ---------- buttons ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;\n  background:var(--brand);color:#fff;padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;\n  cursor:pointer;transition:.18s;white-space:nowrap}\n.btn:hover{background:var(--brand-dark);color:#fff}\n.btn-outline{background:transparent;color:var(--brand);border-color:var(--brand)}\n.btn-outline:hover{background:var(--brand);color:#fff}\n.btn-light{background:#fff;color:var(--brand)}\n.btn-light:hover{background:#eef6f2;color:var(--brand-dark)}\n.btn-accent{background:var(--accent);color:#26200d}\n.btn-accent:hover{background:#e0940e;color:#26200d}\n.btn-sm{padding:7px 13px;font-size:.86rem}\n.btn-block{width:100%}\n\n/* ---------- topbar / header ---------- */\n.topbar{background:var(--brand-dark);color:#cfe6dd;font-size:.84rem}\n.topbar .container{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;padding-top:8px;padding-bottom:8px}\n.topbar a{color:#cfe6dd}\n.topbar .tb-links{display:flex;gap:14px;align-items:center}\nheader.site{position:sticky;top:0;z-index:60;background:#fff;box-shadow:var(--shadow)}\n.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;flex-wrap:nowrap}\n.brand{display:flex;align-items:center;gap:12px;min-width:190px;flex:0 1 auto;overflow:hidden}\n.nav>nav{flex:0 0 auto}\n.brand .logo{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--brand);color:#fff;\n  display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:0 0 auto}\n.brand>span{min-width:0;overflow:hidden}\n.brand b{display:block;font-size:1.02rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.brand small{color:var(--muted);font-size:.75rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.menu{display:flex;align-items:center;gap:1px;list-style:none;margin:0;padding:0;flex-wrap:nowrap}\n.menu a{padding:8px 8px;border-radius:8px;color:var(--ink);font-weight:600;font-size:.845rem;white-space:nowrap}\n.menu a:hover{background:#eef6f2;color:var(--brand)}\n.menu a.active{background:var(--brand);color:#fff}\n.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:1.2rem;cursor:pointer}\n\n/* ---------- hero slider ---------- */\n.hero{position:relative;height:min(72vh,520px);overflow:hidden;background:#0a3a2c}\n.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;background-size:cover;background-position:center;display:grid;place-items:center}\n.slide.on{opacity:1}\n.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,74,55,.92),rgba(7,74,55,.55) 60%,rgba(0,0,0,.35))}\n.slide-in{position:relative;z-index:2;color:#fff;max-width:760px;padding:0 20px;text-align:center}\n.slide-in h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.3)}\n.slide-in p{color:#e3f0ea;font-size:1.05rem}\n.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}\n.hero-dots{position:absolute;bottom:18px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:3}\n.hero-dots button{width:11px;height:11px;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer;padding:0}\n.hero-dots button.on{background:#fff;width:28px;border-radius:6px}\n\n/* ---------- stats strip ---------- */\n.stats{background:var(--brand);color:#fff}\n.stats .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:26px 0}\n.stat{text-align:center}\n.stat b{display:block;font-size:1.9rem;line-height:1.1}\n.stat span{font-size:.86rem;color:#c9e4da}\n\n/* ---------- cards / grids ---------- */\n.grid{display:grid;gap:20px}\n.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}\n.card-pad{padding:20px}\n.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.2s}\n.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#cfe3d9}\n.feature .ic{font-size:1.9rem;margin-bottom:6px}\n.feature h4{margin:0 0 4px;font-size:1.02rem}\n.feature p{margin:0;color:var(--muted);font-size:.9rem}\n\n/* notices */\n.notice-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}\n.notice-item:last-child{border-bottom:0}\n.ndate{flex:0 0 62px;height:62px;border-radius:12px;background:#eef6f2;color:var(--brand);display:grid;place-content:center;text-align:center;font-weight:700;line-height:1.1}\n.ndate span{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}\n.notice-item h4{margin:0 0 2px;font-size:1rem}\n.notice-item p{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n\n/* teacher card */\n.tcard{text-align:center;padding:22px 16px}\n.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 12px;background:#e8f1ed;color:var(--brand);\n  display:grid;place-items:center;font-size:2rem;font-weight:700;border:3px solid #e8f1ed}\n.badge{display:inline-block;background:#eef6f2;color:var(--brand);border-radius:99px;padding:3px 11px;font-size:.76rem;font-weight:600}\n.badge.warn{background:#fff4e0;color:#a56a00}.badge.dan{background:#fdecec;color:#b32020}.badge.ok{background:#e8f7ee;color:#146c3a}\n\n/* gallery */\n.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}\n.gal figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#e8eef2;cursor:pointer}\n.gal img{width:100%;height:100%;object-fit:cover;transition:.3s}\n.gal figure:hover img{transform:scale(1.06)}\n\n/* forms */\n.field{margin-bottom:14px}\n.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}\n.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}\n.input:focus{outline:2px solid #bfe0d3;border-color:var(--brand)}\n.err{color:#c62828;font-size:.8rem;margin-top:4px;display:block}\n\n/* table */\n.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}\ntable.tbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}\ntable.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}\ntable.tbl th{background:#f2f7f5;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:#3d5a4e}\ntable.tbl tbody tr:hover{background:#fafcfb}\n\n/* footer */\nfooter.site{background:#0a2f24;color:#bcd6cb;padding:52px 0 0;margin-top:40px}\nfooter.site h4{color:#fff;font-size:1rem;margin-bottom:14px}\nfooter.site a{color:#bcd6cb;display:block;padding:3px 0;font-size:.9rem}\nfooter.site a:hover{color:#fff}\n.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px}\n.copy{border-top:1px solid rgba(255,255,255,.12);margin-top:34px;padding:16px 0;text-align:center;font-size:.85rem}\n.socials{display:flex;gap:10px;margin-top:12px}\n.socials a{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;padding:0}\n\n/* toast + modal (shared) */\n.toast-host{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}\n.toast{background:#132029;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:.9rem;animation:tin .25s}\n.toast-success{background:#146c3a}.toast-error{background:#b32020}.toast-info{background:#0b5cab}\n.toast.out{opacity:0;transform:translateX(20px);transition:.3s}\n@keyframes tin{from{opacity:0;transform:translateX(20px)}}\n.modal-backdrop{position:fixed;inset:0;background:rgba(10,25,20,.55);z-index:9000;display:grid;place-items:center;padding:16px;overflow:auto}\n.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:min .2s}\n.modal.lg{width:min(950px,100%)} .modal.xl{width:min(1150px,100%)}\n@keyframes min{from{transform:translateY(14px);opacity:0}}\n.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}\n.modal-head h3{margin:0;font-size:1.05rem}\n.modal-body{padding:20px;overflow:auto}\n.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}\n.icon-btn{background:none;border:0;font-size:1.05rem;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px}\n.icon-btn:hover{background:#f0f3f5}\n\n/* responsive */\n@media(max-width:980px){\n  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}\n  .gal{grid-template-columns:repeat(3,1fr)} .fgrid{grid-template-columns:repeat(2,1fr)}\n}\n@media(max-width:1260px){\n  .burger{display:block}\n  .menu{position:fixed;inset:0 0 0 auto;width:min(300px,84vw);background:#fff;flex-direction:column;align-items:stretch;\n    padding:74px 16px 20px;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:.25s;overflow:auto;z-index:70}\n  .menu.open{transform:none}\n  .menu a{padding:12px 14px;border-bottom:1px solid var(--line);border-radius:0;font-size:.95rem}\n  .brand{max-width:none}\n}\n@media(max-width:760px){\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .stats .grid{grid-template-columns:repeat(2,1fr)}\n  .gal{grid-template-columns:repeat(2,1fr)}\n  .fgrid{grid-template-columns:1fr}\n  .section{padding:44px 0}\n  .hero{height:auto;min-height:440px;padding:60px 0}\n  .slide{position:relative;display:none}.slide.on{display:grid}\n}\n\n/* ============ Print / PDF: A4 documents, ID cards, receipts, result sheets ============ */\n@page{size:A4;margin:12mm}\n.print-root{font-family:'Segoe UI','Noto Sans Bengali',Arial,sans-serif;color:#111}\n.a4{width:210mm;min-height:296mm;padding:12mm;margin:0 auto 10mm;background:#fff;box-shadow:0 3px 16px rgba(0,0,0,.15)}\n.doc-head{display:flex;gap:14px;align-items:center;border-bottom:3px double #0b6b4f;padding-bottom:10px;margin-bottom:14px}\n.doc-head .lg{width:74px;height:74px;object-fit:contain;border-radius:8px;background:#0b6b4f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem}\n.doc-head .t{flex:1;text-align:center}\n.doc-head h1{margin:0;font-size:22px;color:#0b6b4f;letter-spacing:.3px}\n.doc-head p{margin:1px 0;font-size:11.5px;color:#333}\n.doc-title{text-align:center;margin:8px 0 14px}\n.doc-title span{display:inline-block;border:1.5px solid #0b6b4f;border-radius:20px;padding:4px 22px;font-weight:700;font-size:13px;color:#0b6b4f;text-transform:uppercase;letter-spacing:1px}\n.ptbl{width:100%;border-collapse:collapse;font-size:11.6px}\n.ptbl th,.ptbl td{border:1px solid #94a3ac;padding:5px 7px;text-align:left}\n.ptbl th{background:#e8f2ee;font-weight:700}\n.ptbl td.c,.ptbl th.c{text-align:center}\n.ptbl td.r{text-align:right}\n.kv{width:100%;border-collapse:collapse;font-size:12px}\n.kv td{padding:4px 6px;vertical-align:top}\n.kv td.k{width:130px;font-weight:600;color:#33424c}\n.kv td.k::after{content:':';float:right}\n.sign-row{display:flex;justify-content:space-between;margin-top:66px;font-size:11.5px;text-align:center}\n.sign-row div{border-top:1px dotted #333;padding-top:4px;min-width:150px}\n.stu-photo{width:28mm;height:33mm;object-fit:cover;border:1px solid #94a3ac;background:#eef2f5;display:grid;place-items:center;font-size:10px;color:#7b8891}\n.doc-foot{margin-top:12px;border-top:1px solid #cbd5da;padding-top:6px;font-size:10px;color:#667;display:flex;justify-content:space-between}\n.watermark{position:absolute;inset:0;display:grid;place-items:center;opacity:.05;font-size:90px;font-weight:800;transform:rotate(-28deg);pointer-events:none}\n\n/* ---- ID card: CR80 standard 85.6mm x 54mm (portrait 54x85.6 used here) ---- */\n.idsheet{display:flex;flex-wrap:wrap;gap:6mm;justify-content:flex-start}\n.idcard{width:54mm;height:85.6mm;border-radius:4mm;overflow:hidden;position:relative;background:#fff;\n  border:1px solid #cbd5da;font-size:8px;page-break-inside:avoid;break-inside:avoid;box-shadow:0 2px 8px rgba(0,0,0,.12)}\n.id-top{background:linear-gradient(135deg,#0b6b4f,#0e8a66);color:#fff;padding:3mm 2mm;text-align:center}\n.id-top img,.id-top .lgph{width:9mm;height:9mm;border-radius:50%;object-fit:cover;background:#fff;color:#0b6b4f;display:grid;place-items:center;margin:0 auto 1mm;font-weight:800;font-size:9px}\n.id-top b{display:block;font-size:8.4px;line-height:1.2}\n.id-top small{font-size:6px;opacity:.9;display:block;line-height:1.2}\n.idcard{display:flex;flex-direction:column}\n.id-photo{width:20mm;height:24mm;object-fit:cover;border:2px solid #0b6b4f;border-radius:2mm;margin:2mm auto 1mm;display:block;background:#eef2f5}\n.id-name{text-align:center;font-weight:800;font-size:9px;color:#0b3;color:#0b6b4f;margin:0 2mm}\n.id-desig{text-align:center;font-size:7px;color:#556;margin-bottom:1.5mm}\n.id-rows{padding:0 3mm;font-size:6.6px;line-height:1.42}\n.id-rows div{display:flex;justify-content:space-between;gap:2mm;border-bottom:.3px dotted #b9c6cd}\n.id-rows span:first-child{color:#556;font-weight:600}\n.id-rows span:last-child{font-weight:700;text-align:right}\n.id-bottom{background:#0b6b4f;color:#fff;text-align:center;font-size:5.6px;padding:1.2mm;margin-top:1mm}\n.id-qr{margin:1mm auto 0;width:12mm;height:12mm;background:#fff;display:block}\n.id-qr img,.id-qr canvas{width:12mm!important;height:12mm!important;display:block}\n.id-spacer{flex:1}\n.id-back{padding:3mm;font-size:6.4px;line-height:1.45}\n.id-back h5{margin:0 0 1mm;font-size:8px;color:#0b6b4f;text-align:center;text-transform:uppercase}\n.id-back ol{margin:0 0 2mm;padding-left:3.5mm}\n.id-sign{margin-top:3mm;text-align:right;font-size:6px}\n.id-sign i{display:block;border-top:.5px solid #333;width:22mm;margin-left:auto;padding-top:.5mm;font-style:normal}\n\n/* ---- result sheet (unique design) ---- */\n.rs-sheet{border:2.5px solid #0d2b5e;padding:10mm!important}\n.rs-border{position:absolute;inset:3mm;border:1px solid #e8b923;pointer-events:none}\n.rs-watermark{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:70px;font-weight:900;letter-spacing:6px;opacity:.08;pointer-events:none;z-index:0}\n.rs-watermark.pass{color:#0a7a3d}\n.rs-watermark.fail{color:#b32020}\n.rs-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}\n.rs-logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#0d2b5e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;border:2px solid #e8b923;flex-shrink:0}\n.rs-titleblock{flex:1;text-align:center}\n.rs-titleblock h1{margin:0;font-size:19px;color:#0d2b5e;letter-spacing:.4px}\n.rs-titleblock p{margin:1px 0;font-size:10.5px;color:#333}\n.rs-examtag{background:#0d2b5e;color:#fff;font-size:10px;font-weight:700;padding:6px 10px;border-radius:6px;text-align:center;line-height:1.4;flex-shrink:0}\n.rs-ribbon{background:linear-gradient(90deg,#7a1129,#0d2b5e);color:#fff;text-align:center;font-weight:700;font-size:12px;letter-spacing:2px;padding:6px;margin:9px 0;border-radius:3px;position:relative;z-index:1}\n.rs-idrow{display:flex;gap:10px;align-items:center;margin:10px 0;position:relative;z-index:1}\n.rs-namebox{flex:1}\n.rs-name{font-size:18px;font-weight:800;color:#0d2b5e}\n.rs-sub{font-size:11px;color:#333;margin-top:2px}\n.rs-sub2{font-size:10px;color:#555;margin-top:1px}\n.rs-medal{width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:3px solid}\n.rs-medal.Pass{border-color:#0a7a3d;background:#eafaf0}\n.rs-medal.Fail{border-color:#b32020;background:#fdecec}\n.rs-medal .g{font-size:15px;font-weight:800;line-height:1;color:#0d2b5e}\n.rs-medal .p{font-size:8px;font-weight:600;color:#333}\n.rs-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}\n.rs-chip{flex:1;min-width:80px;background:#f4f6f9;border:1px solid #d6dde6;border-radius:6px;padding:5px 8px;text-align:center}\n.rs-chip b{display:block;font-size:13px;color:#0d2b5e}\n.rs-chip span{font-size:9px;color:#667;text-transform:uppercase;letter-spacing:.4px}\n\n/* ---- receipt ---- */\n.receipt{width:190mm;background:#fff;padding:8mm;border:1px solid #cbd5da;margin:0 auto 6mm;page-break-inside:avoid}\n.rc-no{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:8px}\n.amt-box{border:2px solid #0b6b4f;border-radius:6px;padding:6px 12px;display:inline-block;font-weight:800;color:#0b6b4f;font-size:15px}\n\n/* ---- fee receipt (unique bengali design) ---- */\n.fr-sheet{border:1.5px solid #6a6fa0;padding:8mm!important;position:relative}\n.fr-code{font-weight:700;color:#4d5187;font-size:11px;margin-bottom:4px}\n.fr-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}\n.fr-logo{width:52px;height:52px;border-radius:50%;background:#6a6fa0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}\n.fr-schoolinfo h1{margin:0;font-size:19px;color:#4d5187;font-weight:800}\n.fr-schoolinfo p{margin:1px 0;font-size:10.5px;color:#4d5187;background:#eef0f9;display:inline-block;padding:2px 10px;border-radius:3px}\n.fr-titlebar{background:#6a6fa0;color:#fff;text-align:center;font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:99px;margin:8px auto;max-width:92%}\n.fr-table th{background:#6a6fa0;color:#fff}\n.fr-table td,.fr-table th{border-color:#8f93bd}\n\n/* ---- printing rules ---- */\n.print-toolbar{position:sticky;top:0;background:#0c2f25;color:#fff;padding:10px 16px;display:flex;gap:10px;\n  align-items:center;flex-wrap:wrap;z-index:50}\n.print-toolbar b{flex:1}\n@media print{\n  *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}\n\n  .print-toolbar,.no-print{display:none!important}\n  body{background:#fff!important;margin:0}\n  .a4{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0;page-break-after:always}\n  .a4:last-child{page-break-after:auto}\n  .receipt{border:1px dashed #999;box-shadow:none}\n  .idcard{box-shadow:none}\n}\n@media(max-width:820px){ .a4,.receipt{width:100%;padding:14px} }\n";

function openPrintWindow(title, bodyHTML) {
  const w = window.open('', '_blank');
  if (!w) { toast('Popup blocked — অনুগ্রহ করে popup অনুমতি দিন', 'error'); return null; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(title)}</title>
    <style>${PRINT_CSS_PLACEHOLDER}</style>

/* QR as inline SVG-free canvas: uses qrcodejs if available in the opener, else text fallback */
function qrDataFor(text, size = 46) {
  if (window.QRCode) {
    try {
      const holder = document.createElement('div');
      new window.QRCode(holder, { text, width: size, height: size, correctLevel: window.QRCode.CorrectLevel.M });
      const cv = holder.querySelector('canvas');
      if (cv) return `<img src="${cv.toDataURL('image/png')}" style="width:12mm;height:12mm;display:block">`;
      const im = holder.querySelector('img');
      if (im && im.src) return `<img src="${im.src}" style="width:12mm;height:12mm;display:block">`;
    } catch { /* fall through */ }
  }
  return `<div style="border:1px solid #333;font-size:5px;padding:1px;text-align:center;word-break:break-all;line-height:1.1">${esc(text)}</div>`;
}

const inWords = n => {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x);
  n = Math.floor(num(n)); if (!n) return 'Zero';
  let out = '';
  if (n >= 100000) { out += three(Math.floor(n / 100000)) + ' Lakh '; n %= 100000; }
  if (n >= 1000) { out += three(Math.floor(n / 1000)) + ' Thousand '; n %= 1000; }
  if (n) out += three(n);
  return out.trim();
};

async function docResultSheet(p) {
  const s = await schoolDoc();
  const [students, classes, sections, subjects, exams, results] =
    await Promise.all(['students', 'classes', 'sections', 'subjects', 'exams', 'results'].map(c => DB.list(c)));
  const examId = p.get('exam'), classId = p.get('class'), sectionId = p.get('section');
  const mode = p.get('mode'), design = p.get('design') || 'standard';
  const cn = id => classes.find(c => c.id === id)?.name || '-';
  const sn = id => sections.find(x => x.id === id)?.name || '-';
  const exam = exams.find(e => e.id === examId);

  let picked;
  if (p.get('student')) picked = results.filter(r => r.studentId === p.get('student') && (!examId || r.examId === examId));
  else if (p.get('students')) { const ids = p.get('students').split(','); picked = results.filter(r => r.examId === examId && ids.includes(r.studentId)); }
  else picked = results.filter(r => r.examId === examId && r.classId === classId && (!sectionId || r.sectionId === sectionId));
  picked = picked.sort((a, b) => num(students.find(x => x.id === a.studentId)?.roll) - num(students.find(x => x.id === b.studentId)?.roll));

  const findStudent = sid => students.find(x => x.id === sid)
    || students.find(x => x.studentId === sid)
    || students.find(x => String(x.roll) === String(sid)) || {};

  const individual = r => {
    const st = findStudent(r.studentId);
    const ex = exams.find(e => e.id === r.examId);
    const subs = subjects.filter(x => x.classId === r.classId);
    const rows = (r.marks || []).map(m => {
      const sub = subs.find(x => x.id === m.subjectId); if (!sub) return '';
      const t = num(m.written) + num(m.mcq) + num(m.practical);
      const g = gradeOf(t / num(sub.fullMarks || 100) * 100);
      return `<tr><td>${esc(sub.name)}</td><td class="c">${num(sub.fullMarks)}</td><td class="c">${num(sub.passMarks)}</td>

/** Handles any legacy "…/print/<name>.html?<query>" URL by rendering it in a new window. */
async function openPrintDoc(url) {
  const m = String(url).match(/print\/([\w-]+)\.html(?:\?(.*))?$/);
  if (!m) return false;
  const fn = PRINT_DOCS[m[1]];
  if (!fn) return false;
  try {
    const { title, html } = await fn(new URLSearchParams(m[2] || ''));
    openPrintWindow(title, html);
  } catch (e) { toast(e.message, 'error'); }
  return true;
}

/** Global interception: <a href="../print/…"> clicks and window.open("../print/…") calls. */
function installPrintInterceptor() {
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href*="print/"]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (!/print\/[\w-]+\.html/.test(href)) return;
    e.preventDefault();
    openPrintDoc(href);
  }, true);

  const nativeOpen = window.open.bind(window);
  window.open = function (url, ...rest) {
    if (url && /print\/[\w-]+\.html/.test(String(url))) { openPrintDoc(String(url)); return null; }
    return nativeOpen(url, ...rest);
  };
}
