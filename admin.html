function waitChart() {
  return new Promise(res => {
    if (window.Chart) return res(window.Chart);
    const t = setInterval(() => { if (window.Chart) { clearInterval(t); res(window.Chart); } }, 60);
    setTimeout(() => { clearInterval(t); res(window.Chart); }, 5000);
  });
}

const __dashCharts = {};
function makeChart(canvasId, config) {
  if (__dashCharts[canvasId]) { try { __dashCharts[canvasId].destroy(); } catch (_) {} delete __dashCharts[canvasId]; }
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const chart = new window.Chart(el, config);
  __dashCharts[canvasId] = chart;
  return chart;
}

async function charts({ students, classes, payments, results }) {
  const Chart = await waitChart(); if (!Chart) return;
  const green = '#0b6b4f', green2 = '#3ddba0';

  makeChart('chStudents', {
    type: 'bar',
    data: {
      labels: classes.sort((a, b) => a.numeric - b.numeric).map(c => 'Class ' + c.name),
      datasets: [
        { label: 'Boys', data: classes.map(c => students.filter(s => s.classId === c.id && s.gender === 'Male').length), backgroundColor: green },
        { label: 'Girls', data: classes.map(c => students.filter(s => s.classId === c.id && s.gender === 'Female').length), backgroundColor: green2 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } }
  });

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d.toISOString().slice(0, 10);
  });
  makeChart('chFees', {
    type: 'line',
    data: {
      labels: days.map(d => fmtDate(d).slice(0, 6)),
      datasets: [{ label: 'Collected', data: days.map(d => payments.filter(p => p.date === d).reduce((a, p) => a + num(p.paid), 0)), borderColor: green, backgroundColor: 'rgba(11,107,79,.14)', fill: true, tension: .32 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });

  const grades = ['A+', 'A', 'A-', 'B', 'C', 'D', 'F'];
  makeChart('chGrades', {
    type: 'doughnut',
    data: {
      labels: grades,
      datasets: [{ data: grades.map(g => results.filter(r => r.grade === g).length),
        backgroundColor: ['#0b6b4f', '#0e8a66', '#3ddba0', '#f5a623', '#e08a1e', '#8a6d3b', '#c62828'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  makeChart('chDue', {
    type: 'pie',
    data: {
      labels: ['Collected', 'Due'],
      datasets: [{ data: [payments.reduce((a, p) => a + num(p.paid), 0), payments.reduce((a, p) => a + num(p.due), 0)], backgroundColor: [green, '#c62828'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

return { render: __render };
})();

      w.querySelector('#go').onclick = async () => {
        const file = w.querySelector('#csv').files[0];
        if (!file) return toast('CSV ফাইল নির্বাচন করুন', 'error');
        const rows = parseCSV(await file.text());
        let ok = 0, fail = 0;
        for (const r of rows) {
          const cls = classes.find(c => c.name.toLowerCase() === String(r.class || '').toLowerCase());
          const sec = sections.find(s => s.classId === cls?.id && s.name.toLowerCase() === String(r.section || '').toLowerCase());
          const doc = {
            ...r, classId: cls?.id || '', sectionId: sec?.id || '',
            studentId: r.studentId || 'STD' + (await nextSeq('student', 1001)),
            admissionNo: r.admissionNo || 'ADM' + new Date().getFullYear() + (await nextSeq('admission', 101)),
            status: r.status || 'Active', photo: ''
          };
          delete doc.class; delete doc.section;
          const { ok: valid } = validate(doc, RULES);
          if (!valid) { fail++; continue; }
          await DB.insert('students', doc); ok++;
        }
        toast(`${ok} টি ইম্পোর্ট হয়েছে${fail ? `, ${fail} টি বাদ পড়েছে` : ''}`, fail ? 'info' : 'success');

  });

/* ---------- compute result from marks ---------- */
function computeResult(marks, subjectDefs) {
  let total = 0, gpSum = 0, fail = false, count = 0;
  for (const m of marks) {
    const sub = subjectDefs.find(s => s.id === m.subjectId); if (!sub) continue;
    const got = num(m.written) + num(m.mcq) + num(m.practical);
    const pct = (got / num(sub.fullMarks || 100)) * 100;
    const g = gradeOf(pct);
    if (got < num(sub.passMarks || 33)) fail = true;
    total += got; gpSum += g.p; count++;
  }
  const average = count ? total / count : 0;
  const gpa = fail ? 0 : (count ? gpSum / count : 0);
  const grade = fail ? 'F' : gradeOf(gpa >= 5 ? 100 : (gpa >= 4 ? 75 : gpa >= 3.5 ? 65 : gpa >= 3 ? 55 : gpa >= 2 ? 45 : gpa >= 1 ? 35 : 0)).g;
  return { totalMarks: total, average, gpa: Math.round(gpa * 100) / 100, grade, status: fail ? 'Fail' : 'Pass' };
}

function simpleForm(title, fields, data, save) {
  modal({
    title, body: `<form>${formHTML(fields, data || {})}</form>`,
    footer: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn" id="s">💾 Save</button>`,
    onOpen: (w, close) => w.querySelector('#s').onclick = async () => {
      const d = readForm(w, fields);
      const rules = Object.fromEntries(fields.filter(f => f.required).map(f => [f.name, [V.required]]));
      const { ok, errors } = validate(d, rules); showErrors(w, errors);
      if (!ok) return toast('ফর্মে ত্রুটি আছে', 'error');
      await save(d); toast('Saved'); close();
    }
  });
}

async function loadMarks(view) {
  const examId = document.getElementById('exam').value;
  const classId = document.getElementById('cls').value;
  const sectionId = document.getElementById('sec').value;
  const area = document.getElementById('area');
  if (!examId || !classId) return toast('Exam ও Class নির্বাচন করুন', 'error');
  const subs = subjects.filter(s => s.classId === classId);
  if (!subs.length) return area.innerHTML = `<div class="empty">এই শ্রেণিতে কোনো বিষয় নেই — Result Setup → Subjects এ যোগ করুন</div>`;
  const kids = students.filter(s => s.classId === classId && (!sectionId || s.sectionId === sectionId) && s.status !== 'Inactive')
    .sort((a, b) => num(a.roll) - num(b.roll));
  if (!kids.length) return area.innerHTML = `<div class="empty">এই শ্রেণিতে কোনো শিক্ষার্থী নেই</div>`;
  const existing = await DB.query('results', r => r.examId === examId);

  area.innerHTML = `<div class="panel"><div class="panel-head">
      <h3>Marks — ${esc(exams.find(e => e.id === examId)?.name)} • Class ${esc(clsName(classId))} ${sectionId ? '(' + esc(secName(sectionId)) + ')' : ''}</h3>
      <button class="btn btn-sm" id="saveAll">💾 Save All & Calculate</button></div>
    <div class="panel-body">
      <div class="toolbar"><div class="field" style="flex:2 1 200px"><input class="input" id="q" placeholder="🔍 Student খুঁজুন"></div>
      <div class="field"><label class="checkbox"><input type="checkbox" id="pub" checked> Publish results (Public site এ দেখাবে)</label></div></div>
      <div id="rows"></div></div></div>`;

  const rowsHost = document.getElementById('rows');
  const paint = (q = '') => {
    const list = kids.filter(k => !q || (k.name + k.roll + k.studentId).toLowerCase().includes(q.toLowerCase()));
    rowsHost.innerHTML = list.map(k => {
      const prev = existing.find(r => r.studentId === k.id);
      return `<details class="panel" style="margin-bottom:10px" data-stu="${esc(k.id)}">
        <summary style="padding:12px 16px;cursor:pointer;font-weight:600">
          Roll ${esc(k.roll)} — ${esc(k.name)} <span class="muted" style="font-weight:400">(${esc(k.studentId)})</span>
          ${prev ? `<span class="badge ${prev.status === 'Pass' ? 'ok' : 'dan'}">${esc(prev.status)} • GPA ${prev.gpa?.toFixed(2)}</span>` : '<span class="badge warn">Not entered</span>'}
        </summary>
        <div class="panel-body nopad"><div class="table-wrap"><table class="tbl">
          <thead><tr><th>Subject</th><th>Full</th><th>Pass</th><th>Written</th><th>MCQ</th><th>Practical</th><th>Total</th><th>Grade</th></tr></thead>
          <tbody>${subs.map(sub => {
            const m = prev?.marks?.find(x => x.subjectId === sub.id) || {};
            return `<tr data-sub="${esc(sub.id)}">
              <td>${esc(sub.name)}</td><td>${num(sub.fullMarks)}</td><td>${num(sub.passMarks)}</td>
              <td><input class="input" style="width:80px;padding:5px" type="number" min="0" data-f="written" value="${num(m.written)}"></td>
              <td><input class="input" style="width:80px;padding:5px" type="number" min="0" data-f="mcq" value="${num(m.mcq)}" ${sub.hasMcq ? '' : 'disabled'}></td>
              <td><input class="input" style="width:80px;padding:5px" type="number" min="0" data-f="practical" value="${num(m.practical)}" ${sub.hasPractical ? '' : 'disabled'}></td>
              <td class="tot"><b>0</b></td><td class="gr">—</td></tr>`;
          }).join('')}</tbody></table></div>
          <div style="padding:10px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            <span class="pill" style="background:#eef6f2">Total: <b class="sumT">0</b></span>
            <span class="pill" style="background:#eef6f2">GPA: <b class="sumG">0.00</b></span>
            <span class="pill" style="background:#eef6f2">Grade: <b class="sumL">—</b></span>
            <input class="input" style="max-width:280px" placeholder="Remarks" data-remarks value="${esc(prev?.remarks || '')}">
          </div></div></details>`;
    }).join('') || `<div class="empty">কোনো শিক্ষার্থী নেই</div>`;

    rowsHost.querySelectorAll('[data-stu]').forEach(det => {
      const recalc = () => {
        const marks = readMarks(det, subs);
        det.querySelectorAll('tbody tr').forEach(tr => {
          const sub = subs.find(s => s.id === tr.dataset.sub);
          const m = marks.find(x => x.subjectId === sub.id);
          const t = num(m.written) + num(m.mcq) + num(m.practical);
          tr.querySelector('.tot b').textContent = t;
          tr.querySelector('.gr').textContent = gradeOf(t / num(sub.fullMarks || 100) * 100).g;
        });
        const r = computeResult(marks, subs);
        det.querySelector('.sumT').textContent = r.totalMarks;
        det.querySelector('.sumG').textContent = r.gpa.toFixed(2);
        det.querySelector('.sumL').textContent = r.grade + ' (' + r.status + ')';
      };
      det.querySelectorAll('input[type=number]').forEach(i => i.oninput = recalc);
      recalc();
    });
  };
  paint();
  bindSearch(document.getElementById('q'), paint);

  document.getElementById('saveAll').onclick = async () => {
    const published = document.getElementById('pub').checked;
    const session = exams.find(e => e.id === examId)?.session || String(new Date().getFullYear());
    let saved = 0;
    for (const det of rowsHost.querySelectorAll('[data-stu]')) {
      const studentId = det.dataset.stu;
      const marks = readMarks(det, subs);
      if (!marks.some(m => num(m.written) + num(m.mcq) + num(m.practical) > 0)) continue;
      const calc = computeResult(marks, subs);
      const doc = { examId, studentId, classId, sectionId: students.find(s => s.id === studentId)?.sectionId || '', session, marks, ...calc, published, remarks: det.querySelector('[data-remarks]').value };
      const prev = existing.find(r => r.studentId === studentId);
      if (prev) await DB.update('results', prev.id, doc); else await DB.insert('results', doc);
      saved++;
    }
    await recalcPositions(examId, classId);
    toast(`${saved} জন শিক্ষার্থীর ফলাফল সংরক্ষিত হয়েছে`);
    loadMarks(view);
  };
}

function readMarks(det, subs) {
  return [...det.querySelectorAll('tbody tr')].map(tr => {
    const o = { subjectId: tr.dataset.sub };
    tr.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = num(i.value));
    return o;
  }).filter(m => subs.some(s => s.id === m.subjectId));
}

async function recalcPositions(examId, classId) {
  const rows = (await DB.query('results', r => r.examId === examId && r.classId === classId))
    .sort((a, b) => num(b.totalMarks) - num(a.totalMarks));
  let pos = 0, last = null, i = 0;
  for (const r of rows) { i++; if (r.totalMarks !== last) { pos = i; last = r.totalMarks; } await DB.update('results', r.id, { position: pos }); }
}

/* ===== module: attendance (ported & adapted from Vidya) ===== */
const MOD_attendance = (function(){
async function __render(view, path) {
  if (path === 'attendance/report') return renderReport(view);

}

async function renderTake(view) {
  const [students, classes, sections, att] = await Promise.all(['students','classes','sections','attendance'].map(c => DB.list(c)));
  const clsName = id => classes.find(c => c.id === id)?.name || '-';
  const secName = id => sections.find(s => s.id === id)?.name || '-';
  const todayStr = today();

  view.innerHTML = panel({
    title: '🗓️ Take Attendance',
    body: `<div class="toolbar">
      <div class="field"><label>Date</label><input class="input" type="date" id="adate" value="${todayStr}"></div>
      <div class="field"><label>Class</label><select class="input" id="aclass"><option value="">Select Class</option>
        ${classes.sort((a,b)=>a.numeric-b.numeric).map(c=>`<option value="${esc(c.id)}">Class ${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Section</label><select class="input" id="asec"><option value="">All</option></select></div>
      <button class="btn" id="load">Load Students</button>
      <button class="btn btn-ghost" id="markAllP">All Present</button>
      <button class="btn btn-ghost" id="markAllA">All Absent</button>
      <button class="btn" id="saveAtt">💾 Save Attendance</button>
    </div>
    <div id="attList" class="empty">ক্লাস ও তারিখ বেছে Load করুন</div>`
  });

  const aclass = document.getElementById('aclass');
  const asec = document.getElementById('asec');
  aclass.onchange = () => {
    const secs = sections.filter(s => s.classId === aclass.value);
    asec.innerHTML = '<option value="">All</option>' + secs.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  };

  document.getElementById('load').onclick = () => {
    const cid = aclass.value, sid = asec.value, d = document.getElementById('adate').value;
    if (!cid) return toast('ক্লাস সিলেক্ট করুন', 'error');
    let list = students.filter(s => s.classId === cid && s.status !== 'Inactive');
    if (sid) list = list.filter(s => s.sectionId === sid);
    list.sort((a,b) => (a.roll||0) - (b.roll||0));
    const existing = att.filter(a => a.date === d && a.classId === cid && (!sid || a.sectionId === sid));
    const statusMap = {};
    existing.forEach(a => { statusMap[a.studentId] = a.status; });

    document.getElementById('attList').innerHTML = list.length ? `<table class="table"><thead><tr>
      <th>#</th><th>Photo</th><th>Name</th><th>Roll</th><th>ID</th><th>Status</th></tr></thead><tbody>
      ${list.map((s,i) => `<tr data-id="${esc(s.id)}">
        <td>${i+1}</td>
        <td>${s.photo ? `<img class="thumb" src="${esc(s.photo)}">` : `<div class="thumb">${esc((s.name||'?')[0])}</div>`}</td>
        <td><b>${esc(s.name)}</b></td>
        <td>${esc(s.roll||'-')}</td>
        <td>${esc(s.studentId||'-')}</td>
        <td>
          <select class="input att-status" style="width:110px">
            <option value="Present" ${statusMap[s.id]==='Present'?'selected':''}>Present</option>
            <option value="Absent" ${statusMap[s.id]==='Absent'?'selected':''}>Absent</option>
            <option value="Late" ${statusMap[s.id]==='Late'?'selected':''}>Late</option>
            <option value="Leave" ${statusMap[s.id]==='Leave'?'selected':''}>Leave</option>
          </select>
        </td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">কোনো শিক্ষার্থী নেই</div>';
  };

  document.getElementById('markAllP').onclick = () => $$('.att-status').forEach(s => s.value = 'Present');
  document.getElementById('markAllA').onclick = () => $$('.att-status').forEach(s => s.value = 'Absent');

  document.getElementById('saveAtt').onclick = async () => {
    const d = document.getElementById('adate').value;
    const cid = aclass.value, sid = asec.value;
    if (!cid || !d) return toast('তারিখ ও ক্লাস দিন', 'error');
    const rows = $$('#attList tr[data-id]');
    if (!rows.length) return toast('আগে Load করুন', 'error');
    // remove old for this date+class
    const old = await DB.list('attendance');
    for (const a of old.filter(x => x.date === d && x.classId === cid && (!sid || x.sectionId === sid))) {
      await DB.remove('attendance', a.id);
    }
    for (const tr of rows) {
      const st = tr.querySelector('.att-status').value;
      await DB.insert('attendance', {
        studentId: tr.dataset.id, date: d, classId: cid, sectionId: sid || '',
        status: st, session: (await DB.list('school'))[0]?.session || ''
      });
    }
    toast('উপস্থিতি সংরক্ষণ হয়েছে');
  };
}

async function renderReport(view) {
  const [students, classes, sections, att] = await Promise.all(['students','classes','sections','attendance'].map(c => DB.list(c)));
  const clsName = id => classes.find(c => c.id === id)?.name || '-';
  const secName = id => sections.find(s => s.id === id)?.name || '-';

  view.innerHTML = panel({
    title: '📈 Attendance Report',
    body: `<div class="toolbar">
      <div class="field"><label>From</label><input class="input" type="date" id="from" value="${today().slice(0,8)}01"></div>
      <div class="field"><label>To</label><input class="input" type="date" id="to" value="${today()}"></div>
      <div class="field"><label>Class</label><select class="input" id="rclass"><option value="">All</option>
        ${classes.sort((a,b)=>a.numeric-b.numeric).map(c=>`<option value="${esc(c.id)}">Class ${esc(c.name)}</option>`).join('')}</select></div>
      <button class="btn" id="genRep">Generate Report</button>
      <button class="btn btn-ghost" id="printRep">🖨️ Print</button>
    </div>
    <div id="repOut" class="empty">রিপোর্ট জেনারেট করুন</div>`
  });

  document.getElementById('genRep').onclick = () => {
    const from = document.getElementById('from').value, to = document.getElementById('to').value, cid = document.getElementById('rclass').value;
    let filtered = att.filter(a => a.date >= from && a.date <= to);
    if (cid) filtered = filtered.filter(a => a.classId === cid);
    const byStudent = {};
    filtered.forEach(a => {
      if (!byStudent[a.studentId]) byStudent[a.studentId] = { Present:0, Absent:0, Late:0, Leave:0, total:0 };
      byStudent[a.studentId][a.status] = (byStudent[a.studentId][a.status] || 0) + 1;
      byStudent[a.studentId].total++;
    });
    const rows = Object.entries(byStudent).map(([sid, st]) => {
      const stu = students.find(s => s.id === sid) || {};
      const pct = st.total ? Math.round((st.Present + st.Late) / st.total * 100) : 0;
      return { stu, st, pct };
    }).sort((a,b) => (a.stu.roll||0)-(b.stu.roll||0));

    document.getElementById('repOut').innerHTML = rows.length ? `<table class="table"><thead><tr>
      <th>#</th><th>Name</th><th>Class</th><th>Roll</th><th>Present</th><th>Absent</th><th>Late</th><th>Leave</th><th>Total</th><th>%</th></tr></thead><tbody>
      ${rows.map((r,i) => `<tr>
        <td>${i+1}</td><td><b>${esc(r.stu.name||'-')}</b></td>
        <td>Class ${esc(clsName(r.stu.classId))} (${esc(secName(r.stu.sectionId))})</td>
        <td>${esc(r.stu.roll||'-')}</td>
        <td class="c">${r.st.Present||0}</td><td class="c">${r.st.Absent||0}</td>
        <td class="c">${r.st.Late||0}</td><td class="c">${r.st.Leave||0}</td>
        <td class="c">${r.st.total}</td>
        <td class="c"><b style="color:${r.pct>=80?'#0b6b4f':r.pct>=60?'#b78100':'#b32020'}">${r.pct}%</b></td>
      </tr>`).join('')}</tbody></table>` : '<div class="empty">কোনো ডেটা নেই</div>';
  };
  document.getElementById('printRep').onclick = () => window.print();
}

return { render: __render };
})();

/* ===== module: messages (adapted from Vidya) ===== */
const MOD_messages = (function(){
async function __render(view, path) {
  if (path === 'messages/compose') return compose(view);
  return list(view);
}

async function list(view) {
  const msgs = await DB.list('messages');
  msgs.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  view.innerHTML = panel({
    title: '💬 Messages',
    actions: `<button class="btn btn-sm" id="compose">✍️ Compose</button>`,
    body: msgs.length ? `<div id="t"></div>` : `<div class="empty">কোনো মেসেজ নেই। নতুন কম্পোজ করুন।</div>`
  });
  if (msgs.length) {
    const dt = new DataTable(document.getElementById('t'), {
      rows: msgs, pageSize: 10, searchKeys: ['title','body','to'],
      cols: [
        { key: 'createdAt', label: 'Date', render: r => fmtDate(r.createdAt) },
        { key: 'title', label: 'Title' },
        { key: 'to', label: 'To', render: r => `<span class="badge">${esc(r.to||'All')}</span>` },
        { key: 'body', label: 'Preview', render: r => esc((r.body||'').slice(0,60)) + '…' },
        { key: 'smsSent', label: 'SMS Status', sortable: false, render: r => r.smsError
          ? `<span class="badge dan" title="${esc(r.smsError)}">⚠️ ব্যর্থ</span>`
          : (r.recipientCount != null ? `<span class="badge ok">✅ ${r.smsSent || 0}/${r.recipientCount}</span>` : `<span class="muted">—</span>`) },
        { key: 'id', label: 'Actions', sortable: false, render: r => `<button class="btn btn-sm btn-danger" data-del="${esc(r.id)}">🗑️</button>` }
      ],
      onRow: tr => {
        const btn = tr.querySelector('[data-del]');
        if (btn) btn.onclick = async () => {
          if (await confirmDlg('মেসেজ ডিলিট করবেন?')) {
            await DB.remove('messages', btn.dataset.del);
            toast('Deleted');
            list(view);
          }
        };
      }
    });
  }
  document.getElementById('compose')?.addEventListener('click', () => location.hash = '#/messages/compose');
}

async function compose(view) {
  const [students, classes] = await Promise.all(['students','classes'].map(c => DB.list(c)));
  view.innerHTML = panel({
    title: '✍️ Compose Message (SMS)',
    body: `<form id="msgForm">
      <div class="field"><label>Title / Subject</label><input class="input" name="title" required placeholder="মেসেজের বিষয় (SMS এর শুরুতে যুক্ত হবে)"></div>
      <div class="field"><label>Send To</label>
        <select class="input" name="to">
          <option value="All Guardians">All Guardians</option>
          <option value="All Students">All Students (নিজস্ব ফোন নম্বর থাকলে)</option>
          ${classes.map(c => `<option value="Class ${esc(c.name)}">Class ${esc(c.name)} Guardians</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Message Body</label><textarea class="input" name="body" rows="6" required placeholder="বার্তা লিখুন..." maxlength="450"></textarea>
        <p class="muted" style="font-size:.78rem;margin-top:4px">বাংলা/ইউনিকোড টেক্সটে প্রতি SMS অংশে প্রায় ৭০ ক্যারেক্টার ধরে — দীর্ঘ মেসেজ একাধিক SMS হিসেবে চার্জ হতে পারে।</p></div>
      <div id="recipientPreview" class="muted" style="font-size:.85rem;margin-bottom:12px"></div>
      <div style="display:flex;gap:10px">
        <button class="btn" type="submit" id="sendBtn">📤 SMS পাঠান</button>
        <button class="btn btn-ghost" type="button" id="cancel">Cancel</button>
      </div>
    </form>`
  });

  function resolveNumbers(to) {
    if (to === 'All Guardians') return students.map(s => s.guardianPhone).filter(Boolean);
    if (to === 'All Students') return students.map(s => s.phone || s.guardianPhone).filter(Boolean);
    const clsName2 = to.replace(/^Class /, '').replace(/ Guardians$/, '');
    const cls = classes.find(c => c.name === clsName2);
    if (!cls) return [];
    return students.filter(s => s.classId === cls.id).map(s => s.guardianPhone).filter(Boolean);
  }
  function updatePreview() {
    const to = document.querySelector('[name=to]').value;
    const nums = [...new Set(resolveNumbers(to))];
    document.getElementById('recipientPreview').textContent = `📱 এই মেসেজটি ${nums.length} জনের ফোন নম্বরে SMS হিসেবে যাবে।`;
  }
  document.querySelector('[name=to]').addEventListener('change', updatePreview);
  updatePreview();

  document.getElementById('cancel').onclick = () => location.hash = '#/messages';
  document.getElementById('msgForm').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const title = fd.get('title'), body = fd.get('body'), to = fd.get('to');
    const numbers = [...new Set(resolveNumbers(to))];
    if (!numbers.length) return toast('এই গ্রুপের কোনো বৈধ ফোন নম্বর পাওয়া যায়নি', 'error');
    if (!await confirmDlg(`${numbers.length} জনের ফোন নম্বরে সত্যিকারের SMS পাঠানো হবে (Balance কাটবে)। নিশ্চিত?`)) return;
    const btn = document.getElementById('sendBtn'); btn.disabled = true; btn.textContent = '⏳ পাঠানো হচ্ছে...';
    let smsResult = null, smsError = '';
    try {
      smsResult = await DB.sendSms(numbers, `${title}: ${body}`);
    } catch (ex) {
      smsError = ex.message || 'SMS পাঠাতে ব্যর্থ';
    }
    await DB.insert('messages', {
      title, body, to,
      recipientCount: numbers.length,
      smsSent: smsResult?.sent ?? 0,
      smsFailed: smsResult ? smsResult.failed : numbers.length,
      smsError: smsError || null,
      createdAt: new Date().toISOString()
    });
    if (smsError) {
      toast('⚠️ ' + smsError, 'error');
    } else {
      toast(`✅ ${smsResult.sent}টি SMS পাঠানো হয়েছে${smsResult.failed ? `, ${smsResult.failed}টি ব্যর্থ` : ''}`);
    }
    location.hash = '#/messages';
  };
}

return { render: __render };
})();

/* ===== module: reports ===== */
const MOD_reports = (function(){
/* reports.js — student / fee / due / result reports with print + CSV */
async function __render(view, path) {
  const [students, classes, sections, payments, results, exams] = await Promise.all(
    ['students', 'classes', 'sections', 'payments', 'results', 'exams'].map(c => DB.list(c)));
  const ctx = { students, classes, sections, payments, results, exams };
  if (path === 'reports/fees') return feeReport(view, ctx);
  if (path === 'reports/due') return dueReport(view, ctx);
  if (path === 'reports/results') return resultReport(view, ctx);
  if (path === 'reports/certificates') return certificatesReport(view, ctx);
  return studentReport(view, ctx);
}

const tableHTML = (head, rows) => `<div class="table-wrap"><table class="tbl">
  <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}">কোনো তথ্য নেই</td></tr>`}</tbody></table></div>`;

function studentReport(view, { students, classes, sections }) {
  const active = students.filter(s => s.status !== 'Inactive');
  const rows = classes.sort((a, b) => a.numeric - b.numeric).map(c => {
    const inC = active.filter(s => s.classId === c.id);
    return [`Class ${esc(c.name)}`,
      esc(sections.filter(x => x.classId === c.id).map(x => x.name).join(', ') || '-'),
      inC.filter(s => s.gender === 'Male').length, inC.filter(s => s.gender === 'Female').length, `<b>${inC.length}</b>`];
  });
  view.innerHTML = `<div class="cards">
      ${statCard({ icon: '👨‍🎓', cls: 'i-green', value: active.length, label: 'Active Students' })}
      ${statCard({ icon: '👦', cls: 'i-blue', value: active.filter(s => s.gender === 'Male').length, label: 'Boys' })}
      ${statCard({ icon: '👧', cls: 'i-purple', value: active.filter(s => s.gender === 'Female').length, label: 'Girls' })}
      ${statCard({ icon: '🚫', cls: 'i-red', value: students.length - active.length, label: 'Inactive / Passed Out' })}
    </div>
    ${panel({ title: '📈 Class-wise Student Report', nopad: true, actions: `<button class="btn btn-sm btn-ghost" id="csv">⬇️ CSV</button><a class="btn btn-sm btn-ghost" target="_blank" href="print/student-list.html">🖨️ Print</a>`, body: tableHTML(['Class', 'Sections', 'Boys', 'Girls', 'Total'], rows) })}
    ${panel({ title: '🩸 Blood Group Distribution', nopad: true, body: tableHTML(['Blood Group', 'Students'],
      [...new Set(active.map(s => s.bloodGroup || 'Unknown'))].map(bg => [esc(bg), active.filter(s => (s.bloodGroup || 'Unknown') === bg).length])) })}`;
  document.getElementById('csv').onclick = () => {
    download(`student_report_${today()}.csv`, '\ufeff' + toCSV(classes.map(c => {
      const inC = active.filter(s => s.classId === c.id);
      return { class: c.name, boys: inC.filter(s => s.gender === 'Male').length, girls: inC.filter(s => s.gender === 'Female').length, total: inC.length };
    })), 'text/csv;charset=utf-8'); toast('Exported');
  };
}

function feeReport(view, { payments, students, classes }) {
  const totalPaid = payments.reduce((a, p) => a + num(p.paid), 0);
  const totalDue = payments.reduce((a, p) => a + num(p.due), 0);
  const byType = {}; const byMethod = {}; const byMonth = {};
  for (const p of payments) {
    byType[p.feeType] = (byType[p.feeType] || 0) + num(p.paid);
    byMethod[p.method] = (byMethod[p.method] || 0) + num(p.paid);
    const m = (p.date || '').slice(0, 7); byMonth[m] = (byMonth[m] || 0) + num(p.paid);
  }
  const clsPaid = classes.map(c => {
    const ids = students.filter(s => s.classId === c.id).map(s => s.id);
    const ps = payments.filter(p => ids.includes(p.studentId));
    return [`Class ${esc(c.name)}`, ps.length, money(ps.reduce((a, p) => a + num(p.paid), 0)), money(ps.reduce((a, p) => a + num(p.due), 0))];
  });
  view.innerHTML = `<div class="cards">
      ${statCard({ icon: '💰', cls: 'i-green', value: money(totalPaid), label: 'Total Collection' })}
      ${statCard({ icon: '⚠️', cls: 'i-red', value: money(totalDue), label: 'Total Due' })}
      ${statCard({ icon: '🧾', cls: 'i-blue', value: payments.length, label: 'Transactions' })}
      ${statCard({ icon: '📅', cls: 'i-amber', value: money(payments.filter(p => p.date === today()).reduce((a, p) => a + num(p.paid), 0)), label: "Today's Collection" })}
    </div>
    ${panel({ title: '💵 Fee Type-wise Collection', nopad: true, actions: `<button class="btn btn-sm btn-ghost" id="csv">⬇️ CSV</button><a class="btn btn-sm btn-ghost" target="_blank" href="print/fee-report.html">🖨️ Print</a>`,
      body: tableHTML(['Fee Type', 'Collected'], Object.entries(byType).map(([k, v]) => [esc(k), money(v)])) })}

function dueReport(view, { payments, students, classes, sections }) {
  const map = {};
  for (const p of payments) if (num(p.due) > 0) { map[p.studentId] = (map[p.studentId] || 0) + num(p.due); }
  const rows = Object.entries(map).map(([id, due]) => {
    const s = students.find(x => x.id === id) || {};
    return [esc(s.studentId || '-'), esc(s.name || '(deleted)'),
      `Class ${esc(classes.find(c => c.id === s.classId)?.name || '-')} (${esc(sections.find(x => x.id === s.sectionId)?.name || '-')})`,
      esc(s.roll || '-'), esc(s.guardianPhone || '-'), `<span class="badge dan">${money(due)}</span>`];
  }).sort((a, b) => 0);
  view.innerHTML = `<div class="cards">
      ${statCard({ icon: '⚠️', cls: 'i-red', value: money(Object.values(map).reduce((a, b) => a + b, 0)), label: 'Total Outstanding' })}
      ${statCard({ icon: '👥', cls: 'i-amber', value: rows.length, label: 'Students with Due' })}
    </div>
    ${panel({ title: '📉 Due Report', nopad: true, actions: `<a class="btn btn-sm btn-ghost" target="_blank" href="print/due-report.html">🖨️ Print</a>`,
      body: tableHTML(['Student ID', 'Name', 'Class', 'Roll', 'Guardian Phone', 'Due'], rows) })}`;
}

function resultReport(view, { results, students, classes, exams }) {
  const grades = ['A+', 'A', 'A-', 'B', 'C', 'D', 'F'];
  const byExam = exams.map(e => {
    const rs = results.filter(r => r.examId === e.id);
    const pass = rs.filter(r => r.status === 'Pass').length;
    return [esc(e.name), esc(e.session), rs.length, pass, rs.length - pass,
      rs.length ? ((pass / rs.length) * 100).toFixed(1) + '%' : '-',
      rs.length ? (rs.reduce((a, r) => a + num(r.gpa), 0) / rs.length).toFixed(2) : '-'];
  });
  const byClass = classes.map(c => {
    const rs = results.filter(r => r.classId === c.id);
    const pass = rs.filter(r => r.status === 'Pass').length;
    return [`Class ${esc(c.name)}`, rs.length, pass, rs.length - pass, rs.filter(r => r.grade === 'A+').length,
      rs.length ? ((pass / rs.length) * 100).toFixed(1) + '%' : '-'];
  });
  const top = results.slice().sort((a, b) => num(b.gpa) - num(a.gpa) || num(b.totalMarks) - num(a.totalMarks)).slice(0, 10)
    .map((r, i) => { const s = students.find(x => x.id === r.studentId) || {};
      return [i + 1, esc(s.name || '-'), esc(s.studentId || '-'), `Class ${esc(classes.find(c => c.id === r.classId)?.name || '-')}`,
        r.totalMarks, num(r.gpa).toFixed(2), esc(r.grade)]; });
  view.innerHTML = `<div class="cards">
      ${statCard({ icon: '📋', cls: 'i-blue', value: results.length, label: 'Total Results' })}
      ${statCard({ icon: '✅', cls: 'i-green', value: results.filter(r => r.status === 'Pass').length, label: 'Passed' })}
      ${statCard({ icon: '❌', cls: 'i-red', value: results.filter(r => r.status === 'Fail').length, label: 'Failed' })}
      ${statCard({ icon: '🌟', cls: 'i-amber', value: results.filter(r => r.grade === 'A+').length, label: 'GPA 5.00 (A+)' })}
    </div>
    ${panel({ title: '🏆 Exam-wise Result Report', nopad: true, actions: `<a class="btn btn-sm btn-ghost" target="_blank" href="print/result-report.html">🖨️ Print</a>`,
      body: tableHTML(['Exam', 'Session', 'Appeared', 'Passed', 'Failed', 'Pass %', 'Avg GPA'], byExam) })}
    ${panel({ title: '🏫 Class-wise Performance', nopad: true, body: tableHTML(['Class', 'Appeared', 'Passed', 'Failed', 'A+ Count', 'Pass %'], byClass) })}
    ${panel({ title: '📊 Grade Distribution', nopad: true, body: tableHTML(['Grade', 'Students'], grades.map(g => [g, results.filter(r => r.grade === g).length])) })}
    ${panel({ title: '🥇 Top 10 Students', nopad: true, body: tableHTML(['#', 'Name', 'Student ID', 'Class', 'Total', 'GPA', 'Grade'], top) })}`;
  void fmtDate;
}

async function profile(view) {
  const s = Auth.session() || {};
  let me = null;
  try { me = await DB.get('users', s.uid); } catch (_) {}
  if (!me) me = { id: s.uid || 'admin_default', name: s.name || 'School Admin', email: s.email || 'admin@school.com', username: 'admin', role: 'admin', phone: '', lastLogin: '-' };
  const users = await DB.list('users').catch(() => []);
  const F = [{ name: 'name', label: 'Full Name', required: true }, { name: 'email', label: 'Email', type: 'email', required: true },
    { name: 'username', label: 'Username' }, { name: 'phone', label: 'Phone' }];
  view.innerHTML = panel({ title: '👤 Admin Profile', body: `<form id="f">${formHTML(F, me)}</form>
      <p class="muted" style="font-size:.85rem">Role: <b>${esc(me.role || 'admin')}</b> • Last login: ${esc(me.lastLogin || '-')}</p>
      <button class="btn" id="save">💾 Save Profile</button>` })

  document.getElementById('save').onclick = async () => {
    const d = readForm(document.getElementById('f'), F);
    const { ok, errors } = validate(d, { name: [V.required], email: [V.required, V.email] });
    showErrors(view, errors); if (!ok) return toast('ফর্মে ত্রুটি আছে', 'error');
    try {
      if (me.id && me.id !== 'admin_default') {
        await DB.update('users', me.id, { ...d, email: d.email.toLowerCase() });
      }
      toast('Profile updated');
    } catch (e) { toast('Save failed: ' + e.message, 'error'); }
  };

  new DataTable(document.getElementById('t'), {
    rows: users, pageSize: 8, searchKeys: ['name', 'email'],
    cols: [{ key: 'name', label: 'Name' }, { key: 'email', label: 'Email' }, { key: 'role', label: 'Role' },
      { key: 'active', label: 'Status', render: r => `<span class="badge ${r.active ? 'ok' : 'dan'}">${r.active ? 'Active' : 'Disabled'}</span>` },
      { key: 'id', label: 'Actions', sortable: false, render: r => r.id === me.id ? '<span class="muted">You</span>' :
        `<div class="actions"><button class="btn btn-sm btn-ghost" data-a="tog" data-id="${esc(r.id)}">${r.active ? '🚫 Disable' : '✅ Enable'}</button>
         <button class="btn btn-sm btn-danger" data-a="del" data-id="${esc(r.id)}">🗑️</button></div>` }],
    onRow: tr => tr.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const u = await DB.get('users', b.dataset.id);
      if (b.dataset.a === 'tog') { await DB.update('users', u.id, { active: !u.active }); toast('Updated'); return profile(view); }
      if (await confirmDlg('ইউজার ডিলিট করবেন?')) { await DB.remove('users', u.id); toast('Deleted'); profile(view); }
    })
  });

  document.getElementById('addu').onclick = async () => {
    const UF = [{ name: 'name', label: 'Name', required: true }, { name: 'email', label: 'Email', type: 'email', required: true },
      { name: 'username', label: 'Username' }, { name: 'password', label: 'Password', type: 'password', required: true },
      { name: 'role', label: 'Role', type: 'select', options: ['admin', 'accountant', 'teacher'] }];
    
    modal({ title: '➕ Add Admin User', body: `<form>${formHTML(UF, { role: 'admin' })}</form>`,
      footer: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn" id="s">Create</button>`,
      onOpen: (w, close) => w.querySelector('#s').onclick = async () => {
        const d = readForm(w, UF);
        const { ok, errors } = validate(d, { name: [V.required], email: [V.required, V.email], password: [V.required, V.minLen(6)] });
        showErrors(w, errors); if (!ok) return;
        try { await Auth.register(d); toast('User created'); close(); profile(view); }
        catch (e) { toast(e.message, 'error'); }
      } });
  };
}

    } catch (e) { toast(e.message, 'error'); }
  };
}

    const btn = document.getElementById('clMigrate'), note = document.getElementById('clMigrateNote');
    btn.disabled = true;
    try {
      const r = await migrateLocalFilesToCloudinary((done, total) => {
        btn.textContent = total ? `⏳ ${done}/${total} ...` : '⏳ স্ক্যান হচ্ছে...';
      });

        : `✅ ${r.migrated}টি ফাইল Cloudinary তে সরানো হয়েছে${r.failed ? `, ${r.failed}টি ব্যর্থ` : ''}।`;
      toast('মাইগ্রেশন সম্পন্ন');
    } catch (e) { toast('মাইগ্রেশন ব্যর্থ: ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '🚚 স্ক্যান করে Cloudinary তে সরান'; }
  };
  document.getElementById('rs').onclick = async () => {
    const f = document.getElementById('fj').files[0];

    if (!await confirmDlg('বর্তমান ডেটা প্রতিস্থাপিত হবে। চালিয়ে যাবেন?')) return;
    try {
      const json = JSON.parse(await f.text());
      await DB.restore(json.data || json);
      toast('Restore সম্পন্ন হয়েছে'); setTimeout(() => location.reload(), 900);
    } catch (e) { toast('ফাইলটি বৈধ backup নয়: ' + e.message, 'error'); }
  };
  document.getElementById('wipe').onclick = async () => {
    if (!await confirmDlg('সব ডেটা মুছে যাবে! নিশ্চিত?')) return;
    if (!await confirmDlg('শেষবার নিশ্চিত করুন — এই কাজ ফেরানো যাবে না।')) return;
    await DB.wipe(); Auth.logout(); location.replace('admin.html');
  };
}

const state = { school: {}, session: null };

/* ===== module: admissions ===== */
const MOD_admissions = (function(){
let classes = [], sections = [];

function clsName(id) { return classes.find(c => c.id === id)?.name || '—'; }

async function __render(view) {
  [classes, sections] = await Promise.all([DB.list('classes'), DB.list('sections')]);
  await list(view);
}

async function list(view) {
  const rows = (await DB.list('admissions')).sort((a, b) => new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0));
  view.innerHTML = panel({
    title: '📥 ভর্তির আবেদন (Admission Applications)',

  });

    rows, searchKeys: ['name', 'fatherName', 'guardianPhone'], empty: 'এখনো কোনো ভর্তির আবেদন জমা পড়েনি',
    cols: [
      { key: 'photo', label: 'Photo', sortable: false, render: r => r.photo ? `<img class="thumb" src="${esc(r.photo)}">` : `<div class="thumb">${esc((r.name || '?')[0])}</div>` },
      { key: 'admissionRoll', label: 'Application No', render: r => esc(r.admissionRoll || '—') },
      { key: 'name', label: 'Student Name' },
      { key: 'fatherName', label: "Father's Name" },
      { key: 'classId', label: 'Class', render: r => 'Class ' + esc(clsName(r.classId)) },
      { key: 'dob', label: 'DOB', render: r => fmtDate(r.dob) },
      { key: 'birthRegNo', label: 'জন্ম নিবন্ধন', sortable: false, render: r => r.birthRegNo
        ? `<button class="badge ${r.birthVerified ? 'ok' : 'warn'}" style="border:0;cursor:pointer" data-a="toggleVerify" data-id="${esc(r.id)}" title="ক্লিক করে ${r.birthVerified ? 'অযাচাইকৃত' : 'যাচাইকৃত'} হিসেবে চিহ্নিত করুন">${r.birthVerified ? '✅ যাচাইকৃত' : '❔ অযাচাইকৃত'}</button>`
        : `<span class="muted">—</span>` },
      { key: 'guardianPhone', label: 'Guardian Phone' },
      { key: 'submittedAt', label: 'Submitted', render: r => r.submittedAt ? fmtDate(r.submittedAt.slice(0, 10)) : '—' },
      { key: 'status', label: 'Status', render: r => `<span class="badge ${r.status === 'Pending' ? 'warn' : 'ok'}">${esc(r.status || 'Pending')}</span>` },
      { key: 'id', label: 'Actions', sortable: false, render: r => `<div class="actions">
        <button class="btn btn-sm btn-ghost" data-a="view" data-id="${esc(r.id)}">👁️</button>
        ${r.birthRegNo ? `<button class="btn btn-sm btn-ghost" data-a="verify" data-id="${esc(r.id)}" title="জন্ম নিবন্ধন যাচাই করুন">🔎</button>` : ''}
        <button class="btn btn-sm" data-a="approve" data-id="${esc(r.id)}">✅ Save</button>
        <button class="btn btn-sm btn-danger" data-a="del" data-id="${esc(r.id)}">🗑️ Delete</button></div>` }
    ],
    onRow: tr => tr.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const app = rows.find(r => r.id === b.dataset.id);
      if (!app) return;
      if (b.dataset.a === 'view') return viewApp(app, view);
      if (b.dataset.a === 'verify') return verifyBirthReg(app);
      if (b.dataset.a === 'toggleVerify') return toggleVerified(app, () => list(view));
      if (b.dataset.a === 'approve') return openApprove(view, app);
      if (b.dataset.a === 'del') {
        if (await confirmDlg(`"${app.name}" এর আবেদনটি মুছে ফেলতে চান? এই কাজ ফেরানো যাবে না।`)) {
          await DB.remove('admissions', app.id); toast('আবেদন মুছে ফেলা হয়েছে'); list(view);
        }

    })
  });
}

/* ---------- জন্ম নিবন্ধন যাচাই — everify.bdris.gov.bd (সরকারি পোর্টাল, ক্যাপচা-সুরক্ষিত,
   কোনো পাবলিক API নেই বলে স্বয়ংক্রিয় যাচাই সম্ভব নয়) — নম্বর কপি করে পোর্টালটি নতুন ট্যাবে খুলে দেয়,
   কর্মী নিজে জন্ম তারিখ ও ক্যাপচা দিয়ে মিলিয়ে দেখে "যাচাইকৃত" হিসেবে চিহ্নিত করেন ---------- */
function verifyBirthReg(a) {
  const num = String(a.birthRegNo || '').trim();
  if (!num) return toast('এই আবেদনে জন্ম নিবন্ধন নম্বর দেওয়া নেই', 'error');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(num).catch(() => {});
  toast(`নম্বর কপি হয়েছে (${num}) — নতুন ট্যাবে জন্ম তারিখ (${a.dob || '—'}) ও ক্যাপচা দিয়ে যাচাই করুন`, 'info');
  window.open('https://everify.bdris.gov.bd/', '_blank', 'noopener');
}
async function toggleVerified(a, done) {
  await DB.update('admissions', a.id, { birthVerified: !a.birthVerified });
  toast(a.birthVerified ? 'অযাচাইকৃত হিসেবে চিহ্নিত হয়েছে' : '✅ যাচাইকৃত হিসেবে চিহ্নিত হয়েছে');
  done();
}

function viewApp(a, view) {
  modal({
    title: `🪪 আবেদনের বিস্তারিত — ${a.name}`, size: 'lg',
    body: `<div class="grid g2" style="gap:10px 24px">
      ${a.photo ? `<div style="grid-column:1/-1;text-align:center"><img src="${esc(a.photo)}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--line)"></div>` : ''}
      <div><b>আবেদন নম্বর:</b> ${esc(a.admissionRoll || '—')}</div>

    onOpen: (w, close) => {
      const secSel = w.querySelector('[name=sectionId]');
      const secs = sections.filter(s => s.classId === app.classId);
      secSel.innerHTML = `<option value="">— Select —</option>` + secs.map(s => `<option value="${esc(s.id)}">Section ${esc(s.name)}</option>`).join('');
      w.querySelector('#confirmApprove').onclick = async () => {
        const extra = readForm(w, fields);

        try {
          const studentId = 'STD' + (await nextSeq('student', 1001));
          const admissionNo = 'ADM' + new Date().getFullYear() + (await nextSeq('admission', 101));
          const data = {
            name: app.name, fatherName: app.fatherName, motherName: app.motherName, dob: app.dob,
            birthRegNo: app.birthRegNo || '',
            gender: app.gender, classId: app.classId, sectionId: extra.sectionId, roll: extra.roll,
            session: extra.session, bloodGroup: app.bloodGroup || '', religion: app.religion || '',
            phone: app.phone || '', guardianPhone: app.guardianPhone, admissionDate: extra.admissionDate,
            status: extra.status, address: app.address || '', photo: app.photo || '',
            studentId, admissionNo
          };
          await DB.insert('students', data);
          await DB.remove('admissions', app.id);
          toast(`ভর্তি সম্পন্ন হয়েছে — Student ID ${studentId}`);
          close();
          list(view);
        } catch (e) { toast(e.message, 'error'); }
      };
    }
  });
}

let __routeRunning = false;
let __routePending = false;
async function route() {
  if (__routeRunning) { __routePending = true; return; }
  __routeRunning = true;
  try {
    await __routeInner();
  } finally {
    __routeRunning = false;
    if (__routePending) { __routePending = false; route(); }
  }
}
async function __routeInner() {
  if (!Auth.isLoggedIn()) return doLogout();
  const path = (location.hash.replace(/^#\/?/, '') || 'dashboard');
  const loader = ROUTES[path] || ROUTES['dashboard'];
  const view = $('#view');
  view.innerHTML = `<div class="empty">লোড হচ্ছে…</div>`;
  $$('.side-link').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/' + path));
  const activeLink = $$('.side-link').find(a => a.classList.contains('active'));
  const activeSub = activeLink && activeLink.closest('.side-submenu');
  $$('.side-group.has-active').forEach(el => el.classList.remove('has-active'));
  if (activeSub) {
    activeSub.classList.add('open');
    const gEl = $(`.side-group[data-g="${activeSub.dataset.sub}"]`);
    if (gEl) gEl.classList.add('open', 'has-active');
  }
  const title = MENU.flatMap(g => g.items).find(i => i[0] === path)?.[2] || 'Dashboard';
  $('#pageTitle').textContent = title;
  document.title = `${title} — ${state.school.name || 'Admin'}`;
  closeSidebar();
  try {
    const mod = loader();
    state.school = (await DB.list('school'))[0] || state.school;
    await mod.render(view, path, state);
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="empty"><span class="ic">⚠️</span>${esc(e.message)}</div>`;
    toast(e.message, 'error');
  }
}

  } catch (_) {

    $('#who').textContent = state.session?.name || 'Admin';

  } catch (_) {}
  try { renderSidebar(); } catch (e) { console.warn('sidebar', e); }
  window.removeEventListener('hashchange', route);
  window.addEventListener('hashchange', route);
  try { await route(); } catch (e) {
    console.error('route error', e);
    const view = document.getElementById('view');
    if (view) view.innerHTML = '<div class="empty">Dashboard load error: ' + (e.message || e) + '</div>';

}


/* ===== login / logout screen switching ===== */
function showLogin() {
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'grid';
  document.getElementById('pw').value = '';
}
let __logoutTimer = null;
function setupAutoLogout(minutes) {
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt =>
    document.removeEventListener(evt, __resetLogoutTimer));
  clearTimeout(__logoutTimer);
  const mins = Number(minutes);
  if (!mins || mins <= 0) return;
  const ms = mins * 60 * 1000;
  __resetLogoutTimer = () => {
    clearTimeout(__logoutTimer);
    __logoutTimer = setTimeout(() => {
      try { toast('নিষ্ক্রিয়তার কারণে স্বয়ংক্রিয়ভাবে লগ-আউট করা হলো', 'error'); } catch (_) {}
      doLogout();
    }, ms);
  };
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt =>
    document.addEventListener(evt, __resetLogoutTimer, { passive: true }));
  __resetLogoutTimer();
}
let __resetLogoutTimer = () => {};

async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'flex';
  await bootAdmin();
  try {
    const sch = (await DB.list('school'))[0] || {};
    setupAutoLogout(sch.autoLogoutMinutes ?? 20);
  } catch (e) { console.warn('auto-logout setup failed', e); }
}
