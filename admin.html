<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Admin Panel</title>
<style>
/* ================= Public Website Theme ================= */
:root{
  /* Unique Emerald-Gold Vibe Theme (matched with public site) */
  --brand:#0a5c47;
  --brand-2:#0f8a68;
  --brand-dark:#063d2f;
  --brand-soft:#e8f5f0;
  --accent:#e8a817;
  --accent-2:#f5c842;
  --ink:#142820;
  --muted:#5a6f66;
  --line:#d4e5dc;
  --bg:#f2f7f4;
  --card:#ffffff;
  --radius:16px;
  --shadow:0 6px 24px rgba(10,92,71,.09);
  --shadow-lg:0 18px 48px rgba(10,92,71,.16);
  --max:1180px;
  --font:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px}
img{max-width:100%;display:block}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-weight:700;letter-spacing:-.2px}
h1{font-size:clamp(1.9rem,4vw,3rem)}
h2{font-size:clamp(1.4rem,2.6vw,2rem)}
p{margin:0 0 1rem}
.mb0{margin-bottom:0}
.container{max-width:var(--max);margin:0 auto;padding:0 18px}
.section{padding:64px 0}
.section.alt{background:#fff}
.center{text-align:center}
.muted{color:var(--muted)}
.sec-head{text-align:center;max-width:720px;margin:0 auto 38px}
.sec-head .kicker{color:var(--brand-2);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:.76rem}
.sec-head h2{margin:.35rem 0 .5rem}
.sec-head p{color:var(--muted);margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid transparent;
  background:var(--brand);color:#fff;padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;
  cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{background:var(--brand-dark);color:#fff}
.btn-outline{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn-outline:hover{background:var(--brand);color:#fff}
.btn-light{background:#fff;color:var(--brand)}
.btn-light:hover{background:#eef6f2;color:var(--brand-dark)}
.btn-accent{background:var(--accent);color:#26200d}
.btn-accent:hover{background:#e0940e;color:#26200d}
.btn-sm{padding:7px 13px;font-size:.86rem}
.btn-block{width:100%}

/* ---------- topbar / header ---------- */
.topbar{background:var(--brand-dark);color:#cfe6dd;font-size:.84rem}
.topbar .container{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;padding-top:8px;padding-bottom:8px}
.topbar a{color:#cfe6dd}
.topbar .tb-links{display:flex;gap:14px;align-items:center}
header.site{position:sticky;top:0;z-index:60;background:#fff;box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:12px;min-width:190px;flex:0 1 auto;overflow:hidden}
.nav>nav{flex:0 0 auto}
.brand .logo{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:0 0 auto}
.brand>span{min-width:0;overflow:hidden}
.brand b{display:block;font-size:1.02rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.75rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;align-items:center;gap:1px;list-style:none;margin:0;padding:0;flex-wrap:nowrap}
.menu a{padding:8px 8px;border-radius:8px;color:var(--ink);font-weight:600;font-size:.845rem;white-space:nowrap}
.menu a:hover{background:#eef6f2;color:var(--brand)}
.menu a.active{background:var(--brand);color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:1.2rem;cursor:pointer}

/* ---------- hero slider ---------- */
.hero{position:relative;height:min(72vh,520px);overflow:hidden;background:#0a3a2c}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;background-size:cover;background-position:center;display:grid;place-items:center}
.slide.on{opacity:1}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,74,55,.92),rgba(7,74,55,.55) 60%,rgba(0,0,0,.35))}
.slide-in{position:relative;z-index:2;color:#fff;max-width:760px;padding:0 20px;text-align:center}
.slide-in h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.slide-in p{color:#e3f0ea;font-size:1.05rem}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hero-dots{position:absolute;bottom:18px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:3}
.hero-dots button{width:11px;height:11px;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer;padding:0}
.hero-dots button.on{background:#fff;width:28px;border-radius:6px}

/* ---------- stats strip ---------- */
.stats{background:var(--brand);color:#fff}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:26px 0}
.stat{text-align:center}
.stat b{display:block;font-size:1.9rem;line-height:1.1}
.stat span{font-size:.86rem;color:#c9e4da}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:20px}
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.2s}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#cfe3d9}
.feature .ic{font-size:1.9rem;margin-bottom:6px}
.feature h4{margin:0 0 4px;font-size:1.02rem}
.feature p{margin:0;color:var(--muted);font-size:.9rem}

/* notices */
.notice-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.notice-item:last-child{border-bottom:0}
.ndate{flex:0 0 62px;height:62px;border-radius:12px;background:#eef6f2;color:var(--brand);display:grid;place-content:center;text-align:center;font-weight:700;line-height:1.1}
.ndate span{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}
.notice-item h4{margin:0 0 2px;font-size:1rem}
.notice-item p{margin:0;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* teacher card */
.tcard{text-align:center;padding:22px 16px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 12px;background:#e8f1ed;color:var(--brand);
  display:grid;place-items:center;font-size:2rem;font-weight:700;border:3px solid #e8f1ed}
.badge{display:inline-block;background:#eef6f2;color:var(--brand);border-radius:99px;padding:3px 11px;font-size:.76rem;font-weight:600}
.badge.warn{background:#fff4e0;color:#a56a00}.badge.dan{background:#fdecec;color:#b32020}.badge.ok{background:#e8f7ee;color:#146c3a}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gal figure{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#e8eef2;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;transition:.3s}
.gal figure:hover img{transform:scale(1.06)}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.input:focus{outline:2px solid #bfe0d3;border-color:var(--brand)}
.err{color:#c62828;font-size:.8rem;margin-top:4px;display:block}

/* table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
table.tbl th,table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.tbl th{background:#f2f7f5;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;color:#3d5a4e}
table.tbl tbody tr:hover{background:#fafcfb}

/* footer */
footer.site{background:#0a2f24;color:#bcd6cb;padding:52px 0 0;margin-top:40px}
footer.site h4{color:#fff;font-size:1rem;margin-bottom:14px}
footer.site a{color:#bcd6cb;display:block;padding:3px 0;font-size:.9rem}
footer.site a:hover{color:#fff}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px}
.copy{border-top:1px solid rgba(255,255,255,.12);margin-top:34px;padding:16px 0;text-align:center;font-size:.85rem}
.socials{display:flex;gap:10px;margin-top:12px}
.socials a{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;padding:0}

/* toast + modal (shared) */
.toast-host{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#132029;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:.9rem;animation:tin .25s}
.toast-success{background:#146c3a}.toast-error{background:#b32020}.toast-info{background:#0b5cab}
.toast.out{opacity:0;transform:translateX(20px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateX(20px)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,25,20,.55);z-index:9000;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:min .2s}
.modal.lg{width:min(950px,100%)} .modal.xl{width:min(1150px,100%)}
@keyframes min{from{transform:translateY(14px);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:1.05rem}
.modal-body{padding:20px;overflow:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.icon-btn{background:none;border:0;font-size:1.05rem;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px}
.icon-btn:hover{background:#f0f3f5}

/* responsive */
@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
  .gal{grid-template-columns:repeat(3,1fr)} .fgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:1260px){
  .burger{display:block}
  .menu{position:fixed;inset:0 0 0 auto;width:min(300px,84vw);background:#fff;flex-direction:column;align-items:stretch;
    padding:74px 16px 20px;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:.25s;overflow:auto;z-index:70}
  .menu.open{transform:none}
  .menu a{padding:12px 14px;border-bottom:1px solid var(--line);border-radius:0;font-size:.95rem}
  .brand{max-width:none}
}
@media(max-width:760px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .gal{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .section{padding:44px 0}
  .hero{height:auto;min-height:440px;padding:60px 0}
  .slide{position:relative;display:none}.slide.on{display:grid}
}

/* ================= Admin Panel ================= */
:root{ --side:262px; }
body.admin{background:#eef2f5;margin:0}
.layout{display:flex;min-height:100vh}

/* sidebar */
.sidebar{width:var(--side);flex:0 0 var(--side);background:linear-gradient(180deg,#063d2f 0%,#0a5c47 100%);color:#c6ddd4;position:fixed;inset:0 auto 0 0;
  overflow-y:auto;z-index:120;transition:transform .25s;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#2a5748;border-radius:3px}
.side-brand{display:flex;gap:11px;align-items:center;padding:16px 16px;border-bottom:1px solid rgba(255,255,255,.09);position:sticky;top:0;background:#063d2f;z-index:2}
.side-brand .logo{width:40px;height:40px;border-radius:10px;background:var(--brand-2,#0e8a66);display:grid;place-items:center;font-weight:800;color:#fff;object-fit:cover;flex:0 0 auto}
.side-brand b{color:#fff;font-size:.94rem;display:block;line-height:1.2}
.side-brand small{font-size:.72rem;color:#8fb3a7}
.side-group{padding:11px 16px;font-size:.76rem;letter-spacing:.6px;color:#c6ddd4;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;user-select:none;transition:.15s;gap:8px}
.side-group:hover{background:rgba(255,255,255,.06);color:#fff}
.side-group.has-active{color:#e8a817}
.side-group .chev{font-size:.62rem;color:#6f9689;transition:transform .2s;flex:0 0 auto}
.side-group.open .chev{transform:rotate(90deg);color:#0f8a68}
.side-submenu{max-height:0;overflow:hidden;transition:max-height .28s ease}
.side-submenu.open{max-height:800px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 26px;color:#c6ddd4;font-size:.88rem;cursor:pointer;border-left:3px solid transparent}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff}
.side-link.active{background:rgba(14,138,102,.24);color:#fff;border-left-color:#3ddba0;font-weight:600}
.side-link .ic{width:20px;text-align:center}
.side-link.top{padding-left:16px}

/* main */
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.topnav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line,#e4e9ee);
  display:flex;align-items:center;gap:12px;padding:11px 20px;box-shadow:0 1px 6px rgba(16,40,60,.05)}
.topnav h1{font-size:1.06rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-toggle{display:none;background:none;border:1px solid var(--line,#e4e9ee);border-radius:9px;padding:7px 11px;font-size:1.15rem;cursor:pointer}
.who{display:flex;align-items:center;gap:9px;font-size:.86rem}
.who .av{width:34px;height:34px;border-radius:50%;background:#0e8a66;color:#fff;display:grid;place-items:center;font-weight:700}
.content{padding:22px;flex:1}
.backdrop{display:none;position:fixed;inset:0;background:rgba(6,20,15,.5);z-index:110}
.backdrop.on{display:block}

/* stat cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.scard{background:#fff;border-radius:14px;padding:17px;display:flex;gap:13px;align-items:center;box-shadow:0 2px 10px rgba(16,40,60,.07);border:1px solid #e8edf1}
.scard .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;flex:0 0 auto}
.scard b{display:block;font-size:1.5rem;line-height:1.15}
.scard span{color:#68757f;font-size:.8rem}
.i-green{background:#e6f6ee;color:#0f7a4d}.i-blue{background:#e7f0fd;color:#1257b8}
.i-amber{background:#fff3e0;color:#a86b00}.i-red{background:#fdecec;color:#b32020}
.i-purple{background:#f1eafd;color:#6b31c9}.i-teal{background:#e2f6f7;color:#0d7a80}

/* panels */
.panel{background:#fff;border:1px solid #e8edf1;border-radius:14px;box-shadow:0 2px 10px rgba(16,40,60,.06);margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #eef2f5}
.panel-head h3{margin:0;font-size:1rem;flex:1}
.panel-body{padding:18px}
.panel-body.nopad{padding:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .field{margin:0;min-width:150px;flex:1 1 150px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.chart-box{position:relative;height:290px}
.pill{padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700}
.actions{display:flex;gap:6px}
.empty{padding:44px 20px;text-align:center;color:#7b8891}
.empty .ic{font-size:2.4rem;display:block;margin-bottom:6px}
.pager{display:flex;gap:6px;justify-content:center;padding:14px;flex-wrap:wrap}
.pager button{border:1px solid #dde4ea;background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-size:.85rem}
.pager button.on{background:#0b6b4f;color:#fff;border-color:#0b6b4f}
.btn-danger{background:#c62828}.btn-danger:hover{background:#a11f1f}
.btn-ghost{background:#eef2f5;color:#33424c}.btn-ghost:hover{background:#e0e7ec;color:#33424c}
.checkbox{display:flex;align-items:center;gap:7px;font-size:.88rem}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#e8f1ed;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#0b6b4f}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid #dde4ea;background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-size:.87rem}
.tabs button.on{background:#0b6b4f;border-color:#0b6b4f;color:#fff}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(135deg,#0b6b4f,#074a37 60%,#062a20)}
.login-card{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:min(430px,100%);padding:32px}
.login-card .logo{width:62px;height:62px;border-radius:16px;background:#0b6b4f;color:#fff;display:grid;place-items:center;
  font-size:1.5rem;font-weight:800;margin:0 auto 12px;object-fit:cover}

@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}.sb-toggle{display:block}
  .row,.row3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .cards{grid-template-columns:1fr}.content{padding:14px}
  .who span{display:none}
}

/* ============ Print / PDF: A4 documents, ID cards, receipts, result sheets ============ */
@page{size:A4;margin:12mm}
.print-root{font-family:'Segoe UI','Noto Sans Bengali',Arial,sans-serif;color:#111}
.a4{width:210mm;min-height:296mm;padding:12mm;margin:0 auto 10mm;background:#fff;box-shadow:0 3px 16px rgba(0,0,0,.15)}
.doc-head{display:flex;gap:14px;align-items:center;border-bottom:3px double #0b6b4f;padding-bottom:10px;margin-bottom:14px}
.doc-head .lg{width:74px;height:74px;object-fit:contain;border-radius:8px;background:#0b6b4f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem}
.doc-head .t{flex:1;text-align:center}
.doc-head h1{margin:0;font-size:22px;color:#0b6b4f;letter-spacing:.3px}
.doc-head p{margin:1px 0;font-size:11.5px;color:#333}
.doc-title{text-align:center;margin:8px 0 14px}
.doc-title span{display:inline-block;border:1.5px solid #0b6b4f;border-radius:20px;padding:4px 22px;font-weight:700;font-size:13px;color:#0b6b4f;text-transform:uppercase;letter-spacing:1px}
.ptbl{width:100%;border-collapse:collapse;font-size:11.6px}
.ptbl th,.ptbl td{border:1px solid #94a3ac;padding:5px 7px;text-align:left}
.ptbl th{background:#e8f2ee;font-weight:700}
.ptbl td.c,.ptbl th.c{text-align:center}
.ptbl td.r{text-align:right}
.kv{width:100%;border-collapse:collapse;font-size:12px}
.kv td{padding:4px 6px;vertical-align:top}
.kv td.k{width:130px;font-weight:600;color:#33424c}
.kv td.k::after{content:':';float:right}
.sign-row{display:flex;justify-content:space-between;margin-top:46px;font-size:11.5px;text-align:center}
.sign-row div{border-top:1px dotted #333;padding-top:4px;min-width:150px}
.stu-photo{width:28mm;height:33mm;object-fit:cover;border:1px solid #94a3ac;background:#eef2f5;display:grid;place-items:center;font-size:10px;color:#7b8891}
.doc-foot{margin-top:12px;border-top:1px solid #cbd5da;padding-top:6px;font-size:10px;color:#667;display:flex;justify-content:space-between}
.watermark{position:absolute;inset:0;display:grid;place-items:center;opacity:.05;font-size:90px;font-weight:800;transform:rotate(-28deg);pointer-events:none}

<script>
/* ============================================================
   School Management Admin Panel — single-file build
   ============================================================ */

/* ============================================================
   ⚙️ CONFIG — Cloudflare D1 (production database) + Cloudinary (image/backup storage)
   ডিপ্লয় করার আগে এই মানগুলো নিজের একাউন্ট অনুযায়ী বসান।
   বিস্তারিত ধাপে ধাপে গাইড: BACKEND.md
   ============================================================ */
const APP_CONFIG = {
  // Cloudflare Pages Functions API — সাধারণত পরিবর্তনের দরকার নেই (functions/api/ ফোল্ডার এটি হ্যান্ডেল করে)
  apiBase: '/api',
  // এই admin.html কে D1 এ লেখার (create/update/delete) অনুমতি দেয়।
  // Cloudflare Pages → Settings → Environment Variables এ ADMIN_API_KEY নামে যে গোপন মান বসাবেন,
  // হুবহু সেই একই মান নিচে বসান। এই মান কাউকে শেয়ার করবেন না।
  adminKey: '778dd50e7bd67764cee506c84cea0b83518d1f971bc9462490e563439a5b33e4',
  cloudinary: {
    cloudName: 'y2jlujeh',        // Cloudinary Dashboard → Cloud name
    uploadPreset: 'ccdsbd',  // Cloudinary → Settings → Upload → Add unsigned upload preset
    folder: 'school'                          // Cloudinary তে ছবি ও ব্যাকআপ যে ফোল্ডারে জমা হবে
  }
};

/* utils.js — helpers shared by public site + admin panel */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ---------- XSS-safe helpers ---------- */
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(v) { return esc(v); }

/* ---------- ids / numbers ---------- */
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n, l = 4) => String(n).padStart(l, '0');
const money = n => '৳' + Number(n || 0).toLocaleString('en-BD', { maximumFractionDigits: 2 });
const num = n => Number(n || 0);

/* ---------- dates ---------- */
const today = () => new Date().toISOString().slice(0, 10);
function fmtDate(d) {
  if (!d) return '-';
  const x = new Date(d); if (isNaN(x)) return d;
  return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function bnNum(n) {
  const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
  return String(n).padStart(2, '0').split('').map(d => digits[+d] ?? d).join('');
}

/* ---------- validation ---------- */
const V = {
  required: v => (v !== null && v !== undefined && String(v).trim() !== '') || 'This field is required',
  email: v => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || 'Invalid email address',
  phone: v => !v || /^[0-9+\-\s()]{6,20}$/.test(v) || 'Invalid phone number',
  minLen: n => v => (String(v || '').length >= n) || `Minimum ${n} characters`,
  numberMin: n => v => (Number(v) >= n) || `Must be ≥ ${n}`,
};
function validate(obj, rules) {
  const errors = {};
  for (const [field, list] of Object.entries(rules)) {
    for (const rule of list) {
      const r = rule(obj[field]);
      if (r !== true) { errors[field] = r; break; }
    }
  }
  return { ok: Object.keys(errors).length === 0, errors };
}

/* ---------- toast ---------- */
function toast(msg, type = 'success') {
  let host = $('#toastHost');
  if (!host) { host = document.createElement('div'); host.id = 'toastHost'; host.className = 'toast-host'; document.body.appendChild(host); }
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2800);
}

/* ---------- modal ---------- */
function modal({ title, body, size = '', onOpen, footer = '' }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${size}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
  </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.hasAttribute('data-close')) close(); });
  document.addEventListener('keydown', function esckey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esckey); } });
  onOpen && onOpen(wrap, close);
  return { el: wrap, close };
}
function confirmDlg(msg) {
  return new Promise(res => {
    const m = modal({
      title: 'Please confirm', body: `<p class="mb0">${esc(msg)}</p>`,
      footer: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-yes>Yes, continue</button>`,
      onOpen: (w, close) => {
        w.querySelector('[data-yes]').onclick = () => { close(); res(true); };
        w.addEventListener('click', e => { if (e.target === w || e.target.hasAttribute('data-close')) res(false); });
      }
    });
    void m;
  });
}

/* ---------- file → dataURL (images stored as base64) ---------- */
function fileToDataURL(file, maxW = 600) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      if (!file.type.startsWith('image/')) return resolve(fr.result);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Cloudinary: image + JSON backup storage (unsigned client-side upload) ---------- */
function cloudinaryReady() {
  const c = APP_CONFIG.cloudinary;
  return !!(c.cloudName && c.cloudName !== 'CHANGE_ME_CLOUD_NAME' && c.uploadPreset && c.uploadPreset !== 'CHANGE_ME_UPLOAD_PRESET');
}
function resizeImageToBlob(file, maxW = 600) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) return resolve(file);
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
      };
      img.onerror = () => resolve(file);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* Cloudinary tags — এই ট্যাগ দিয়েই পরে ব্রাউজার থেকে ফাইলের তালিকা পড়া যায়
   (res.cloudinary.com/<cloud>/<type>/list/<tag>.json — Settings → Security এ
    "Resource list" restriction বন্ধ থাকলে কাজ করে)। */
const CL_TAG_ASSET  = 'school_asset';   // সব ছবি/ফাইল
const CL_TAG_BACKUP = 'school_backup';  // ডেটাবেসের JSON ব্যাকআপ

/* পুরো Cloudinary রেসপন্স ফেরত দেয় (secure_url, public_id, bytes, created_at ...) */
async function cloudinaryUploadFull(fileOrBlob, { resourceType = 'image', publicIdPrefix = '', tags = [CL_TAG_ASSET], publicId = '' } = {}) {
  const { cloudName, uploadPreset, folder } = APP_CONFIG.cloudinary;
  const fd = new FormData();
  fd.append('file', fileOrBlob);
  fd.append('upload_preset', uploadPreset);
  if (folder) fd.append('folder', folder);
  const pid = publicId || (publicIdPrefix ? publicIdPrefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) : '');
  if (pid) fd.append('public_id', pid);
  if (tags && tags.length) fd.append('tags', tags.join(','));
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`, { method: 'POST', body: fd });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j?.error?.message ? ' — ' + j.error.message : ''; } catch (_) {}
    throw new Error('Cloudinary আপলোড ব্যর্থ (' + res.status + ')' + detail);
  }
  return res.json();
}
async function cloudinaryUpload(fileOrBlob, opts = {}) {
  return (await cloudinaryUploadFull(fileOrBlob, opts)).secure_url;
}
/* ট্যাগ ধরে Cloudinary থেকে ফাইলের তালিকা (কোনো API secret লাগে না) */
async function cloudinaryList(tag, resourceType = 'raw') {
  const { cloudName } = APP_CONFIG.cloudinary;
  const res = await fetch(`https://res.cloudinary.com/${cloudName}/${resourceType}/list/${tag}.json?t=${Date.now()}`);
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('তালিকা আনা যায়নি (' + res.status + ') — Cloudinary → Settings → Security → "Resource list" আনচেক করুন');
  const json = await res.json();
  return (json.resources || []).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
}
function cloudinaryUrlOf(resource, resourceType = 'raw') {
  const { cloudName } = APP_CONFIG.cloudinary;
  return `https://res.cloudinary.com/${cloudName}/${resourceType}/upload/v${resource.version}/${resource.public_id}${resource.format ? '.' + resource.format : ''}`;
}
/* ---------- image field → hosted URL: Cloudinary if configured, otherwise base64 fallback (works offline / zero setup) ---------- */
async function uploadImage(file, maxW = 600, prefix = 'img') {
  if (!file) return '';
  if (cloudinaryReady()) {
    try {
      const blob = await resizeImageToBlob(file, maxW);
      return await cloudinaryUpload(blob, { publicIdPrefix: prefix, tags: [CL_TAG_ASSET] });
    } catch (e) {
      console.warn('Cloudinary upload failed, falling back to local image storage:', e);
      toast('Cloudinary আপলোড ব্যর্থ, লোকাল ছবি ব্যবহার হচ্ছে', 'error');
    }
  }
  return fileToDataURL(file, maxW);
}
/* ---------- non-image file (e.g. notice PDF attachment) → hosted URL, same Cloudinary/base64 fallback pattern ---------- */
async function uploadFile(file, prefix = 'file') {
  if (!file) return '';
  if (cloudinaryReady()) {
    try { return await cloudinaryUpload(file, { resourceType: 'auto', publicIdPrefix: prefix, tags: [CL_TAG_ASSET] }); }
    catch (e) {
      console.warn('Cloudinary upload failed, falling back to local file storage:', e);
      toast('Cloudinary আপলোড ব্যর্থ, লোকাল ফাইল ব্যবহার হচ্ছে', 'error');
    }
  }
  return fileToDataURL(file, 1e9);
}

/* ============================================================
   ☁️ Cloudinary ব্যাকআপ ইঞ্জিন — পুরো D1 ডেটাবেসের JSON কপি +
   পুরোনো base64 ছবিগুলো Cloudinary তে সরানোর মাইগ্রেশন
   ============================================================ */
const CL_BACKUP_LAST_KEY = 'school_cl_last_backup';
const CL_AUTO_BACKUP_KEY = 'school_cl_auto_backup';

/* পুরো ডেটাবেস JSON হিসেবে Cloudinary তে (raw ফাইল) আপলোড */
async function cloudBackupNow() {
  if (!cloudinaryReady()) throw new Error('Cloudinary কনফিগার করা নেই');
  const data = await DB.dump();
  const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data }, null, 2);
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const file = new File([new Blob([payload], { type: 'application/json' })], `school_backup_${stamp}.json`, { type: 'application/json' });
  const out = await cloudinaryUploadFull(file, {
    resourceType: 'raw',
    publicId: `backup_${stamp}`,
    tags: [CL_TAG_BACKUP]
  });
  try {
    localStorage.setItem(CL_BACKUP_LAST_KEY, JSON.stringify({ at: new Date().toISOString(), url: out.secure_url, bytes: out.bytes }));
  } catch (_) {}
  return out;
}

/* ডেটাবেসে থেকে যাওয়া base64 (data:) ছবি/ফাইল খুঁজে Cloudinary তে সরিয়ে দেয়,
   তারপর রেকর্ডে শুধু URL রেখে দেয় — ফলে সব ফাইলই Cloudinary তে জমা থাকে। */
function collectDataUrlFields(obj, path = []) {
  const found = [];
  if (!obj || typeof obj !== 'object') return found;
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v === 'string' && v.startsWith('data:')) found.push({ path: [...path, k], value: v });
    else if (v && typeof v === 'object') found.push(...collectDataUrlFields(v, [...path, k]));
  }
  return found;
}
function setByPath(obj, path, value) {
  let cur = obj;
  for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
  cur[path[path.length - 1]] = value;
}
async function migrateLocalFilesToCloudinary(onProgress = () => {}) {
  if (!cloudinaryReady()) throw new Error('Cloudinary কনফিগার করা নেই');
  const dump = await DB.dump();
  const jobs = [];
  for (const [collection, rows] of Object.entries(dump || {})) {
    for (const row of rows || []) {
      for (const f of collectDataUrlFields(row)) jobs.push({ collection, row, ...f });
    }
  }
  let done = 0, failed = 0;
  const touched = new Set();
  onProgress(0, jobs.length);
  for (const job of jobs) {
    try {
      const blob = await (await fetch(job.value)).blob();
      const isImage = (blob.type || '').startsWith('image/');
      const url = await cloudinaryUpload(blob, {
        resourceType: isImage ? 'image' : 'raw',
        publicIdPrefix: 'migrated_' + job.collection,
        tags: [CL_TAG_ASSET]
      });
      setByPath(job.row, job.path, url);
      touched.add(job.collection);
    } catch (e) { failed++; console.warn('মাইগ্রেশন ব্যর্থ:', job.collection, job.path.join('.'), e.message); }
    onProgress(++done, jobs.length);
  }
  for (const c of touched) await DB.replaceAll(c, dump[c]);
  DB.invalidateAll();
  return { total: jobs.length, migrated: jobs.length - failed, failed };
}

/* ---------- CSV ---------- */
function toCSV(rows, headers) {
  const cols = headers || Object.keys(rows[0] || {});
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n');
}
function parseCSV(text) {
  const rows = []; let cur = [], val = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { val += '"'; i++; }
      else if (ch === '"') inQ = false;
      else val += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { cur.push(val); val = ''; }
    else if (ch === '\n') { cur.push(val); rows.push(cur); cur = []; val = ''; }
    else if (ch !== '\r') val += ch;
  }
  if (val !== '' || cur.length) { cur.push(val); rows.push(cur); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(c => c !== '')).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
}
function download(filename, content, mime = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- grading (Bangladesh GPA-5 scale) ---------- */
function gradeOf(pct) {
  if (pct >= 80) return { g: 'A+', p: 5.00 };
  if (pct >= 70) return { g: 'A',  p: 4.00 };
  if (pct >= 60) return { g: 'A-', p: 3.50 };
  if (pct >= 50) return { g: 'B',  p: 3.00 };
  if (pct >= 40) return { g: 'C',  p: 2.00 };
  if (pct >= 33) return { g: 'D',  p: 1.00 };
  return { g: 'F', p: 0.00 };
}
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* db.js — storage abstraction layer.
   Default adapter: LocalStorageAdapter (works offline, zero setup).
   Swap in SupabaseAdapter / FirebaseAdapter later without touching modules:
   every module only ever calls  DB.list / get / insert / update / remove / query.
*/

const COLLECTIONS = [
  'users', 'school', 'students', 'teachers', 'admissions', 'classes', 'sections', 'subjects',
  'feeHeads', 'payments', 'exams', 'results', 'notices', 'events',
  'albums', 'photos', 'videos', 'banners', 'counters', 'syllabus',
  'attendance', 'messages', 'routines', 'examRoutine', 'studentNotices'
];

/* ---- kept for reference / emergency offline fallback (see D1Adapter.list below) ---- */
class LocalStorageAdapter {
  constructor(ns = 'sunrise_v1') {
    this.ns = ns;
    this._mem = {}; // in-memory fallback when localStorage is blocked (Android content://)
  }
  key(c) { return `${this.ns}:${c}`; }
  _read(c) {
    try {
      const raw = localStorage.getItem(this.key(c));
      if (raw != null) return JSON.parse(raw) || [];
    } catch (_) {}
    return this._mem[c] || [];
  }
  _write(c, rows) {
    this._mem[c] = rows;
    try { localStorage.setItem(this.key(c), JSON.stringify(rows)); } catch (_) {}
  }

  async list(c) { const rows = this._read(c); return c === 'classes' ? rows.slice().sort((a, b) => (a.numeric ?? 0) - (b.numeric ?? 0)) : rows; }
  async get(c, id) { return this._read(c).find(r => r.id === id) || null; }
  async insert(c, doc) {
    const rows = this._read(c);
    const row = { id: doc.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...doc };
    rows.push(row); this._write(c, rows); return row;
  }
  async update(c, id, patch) {
    const rows = this._read(c); const i = rows.findIndex(r => r.id === id);
    if (i < 0) throw new Error('Record not found');
    rows[i] = { ...rows[i], ...patch, updatedAt: new Date().toISOString() };
    this._write(c, rows); return rows[i];
  }
  async remove(c, id) {
    const rows = this._read(c).filter(r => r.id !== id); this._write(c, rows); return true;
  }
  async query(c, predicate) { return this._read(c).filter(predicate); }
  async bulkInsert(c, docs) { const out = []; for (const d of docs) out.push(await this.insert(c, d)); return out; }
  async replaceAll(c, rows) { this._write(c, rows); }
  async dump() { const o = {}; for (const c of COLLECTIONS) o[c] = this._read(c); return o; }
  async restore(obj) { for (const c of COLLECTIONS) if (obj[c]) this._write(c, obj[c]); }
  async wipe() { for (const c of COLLECTIONS) localStorage.removeItem(this.key(c)); }
}

/* ---- D1Adapter — production database.
   Talks to Cloudflare Pages Functions (functions/api/[[path]].js), which reads/writes
   a Cloudflare D1 database. Same DB.list/get/insert/update/remove/query interface as
   LocalStorageAdapter above, so every module in this file works unchanged. ---- */
class D1Adapter {
  constructor({ apiBase = '/api', adminKey = '' } = {}) {
    this.apiBase = apiBase.replace(/\/$/, '');
    this.adminKey = adminKey;
    this._cache = {};     // collection -> rows[] (short-lived read cache; cleared on any write)
    this._inflight = {};  // collection -> in-flight fetch promise (avoids duplicate parallel requests)
    this._localNs = 'sunrise_v1_cache'; // read-only offline fallback snapshot
  }
  _headers() {
    const h = { 'Content-Type': 'application/json' };
    if (this.adminKey) h['X-Admin-Key'] = this.adminKey;
    return h;
  }
  async _err(res, what) {
    let msg = `${what} failed (${res.status})`;
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
    return msg;
  }
  _cacheLocal(c, rows) { try { localStorage.setItem(`${this._localNs}:${c}`, JSON.stringify(rows)); } catch (_) {} }
  _readLocalCache(c) { try { return JSON.parse(localStorage.getItem(`${this._localNs}:${c}`)) || []; } catch (_) { return []; } }

  invalidate(c) { delete this._cache[c]; }
  invalidateAll() { this._cache = {}; }

  async _fetchList(c) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}`, { headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, `লোড (${c})`));
    let rows = await res.json();
    if (c === 'classes') rows = rows.slice().sort((a, b) => (a.numeric ?? 0) - (b.numeric ?? 0));
    this._cacheLocal(c, rows);
    return rows;
  }
  async list(c) {
    if (this._cache[c]) return this._cache[c];
    if (!this._inflight[c]) {
      this._inflight[c] = this._fetchList(c)
        .then(rows => { this._cache[c] = rows; delete this._inflight[c]; return rows; })
        .catch(err => {
          delete this._inflight[c];
          // network hiccup: serve last-known-good local snapshot so the UI keeps working
          const fallback = this._readLocalCache(c);
          if (fallback.length || navigator.onLine === false) { console.warn('DB.list offline fallback:', c, err.message); return fallback; }
          throw err;
        });
    }
    return this._inflight[c];
  }
  async get(c, id) {
    const cached = (this._cache[c] || []).find(r => r.id === id);
    if (cached) return cached;
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { headers: this._headers() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(await this._err(res, `লোড (${c}/${id})`));
    return res.json();
  }
  async insert(c, doc) {
    const row = { id: doc.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...doc };
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}`, { method: 'POST', headers: this._headers(), body: JSON.stringify(row) });
    if (!res.ok) throw new Error(await this._err(res, `সংরক্ষণ (${c})`));
    this.invalidate(c);
    return res.json();
  }
  async update(c, id, patch) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { method: 'PATCH', headers: this._headers(), body: JSON.stringify(patch) });
    if (!res.ok) throw new Error(await this._err(res, `আপডেট (${c}/${id})`));
    this.invalidate(c);
    return res.json();
  }
  async remove(c, id) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, `মুছে ফেলা (${c}/${id})`));
    this.invalidate(c);
    return true;
  }
  async query(c, predicate) { return (await this.list(c)).filter(predicate); }
  async bulkInsert(c, docs) {
    const rows = docs.map(d => ({ id: d.id || uid(c.slice(0, 3)), createdAt: new Date().toISOString(), ...d }));
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/bulk`, { method: 'POST', headers: this._headers(), body: JSON.stringify(rows) });
    if (!res.ok) throw new Error(await this._err(res, `বাল্ক সংরক্ষণ (${c})`));
    this.invalidate(c);
    return res.json();
  }
  async replaceAll(c, rows) {
    const res = await fetch(`${this.apiBase}/${encodeURIComponent(c)}/replace-all`, { method: 'POST', headers: this._headers(), body: JSON.stringify(rows) });
    if (!res.ok) throw new Error(await this._err(res, `প্রতিস্থাপন (${c})`));
    this.invalidate(c);
  }
  async dump() {
    const res = await fetch(`${this.apiBase}/_dump`, { headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, 'ব্যাকআপ তৈরি'));
    return res.json();
  }
  async restore(obj) {
    const res = await fetch(`${this.apiBase}/_restore`, { method: 'POST', headers: this._headers(), body: JSON.stringify(obj) });
    if (!res.ok) throw new Error(await this._err(res, 'পুনরুদ্ধার'));
    this.invalidateAll();
  }
  async wipe() {
    const res = await fetch(`${this.apiBase}/_wipe`, { method: 'POST', headers: this._headers() });
    if (!res.ok) throw new Error(await this._err(res, 'রিসেট'));
    this.invalidateAll();
  }
  /* numbers: string[], message: string → { sent, failed, results[] } */
  async sendSms(numbers, message) {
    const res = await fetch(`${this.apiBase}/_send-sms`, { method: 'POST', headers: this._headers(), body: JSON.stringify({ numbers, message }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || await this._err(res, 'SMS পাঠানো'));
    return data;
  }
}

/* ---- sequential counters: Student ID, Receipt No ---- */
async function nextSeq(name, start = 1) {

/* auth.js — authentication & route protection.
   WebCrypto PBKDF2 when available; falls back so login works on file:// too.
*/

const SESSION_KEY = 'sunrise_v1:session';
const enc = new TextEncoder();
const HAS_CRYPTO = !!(window.crypto && window.crypto.subtle);

function randB64(n = 16) {
  try {
    const a = crypto.getRandomValues(new Uint8Array(n));
    return btoa(String.fromCharCode(...a));
  } catch {
    return btoa(String(Date.now()) + Math.random().toString(36).slice(2));
  }
}

async function simpleHash(password, salt) {
  const str = String(password) + '|' + String(salt) + '|sunrise_v1_salt';
  if (HAS_CRYPTO) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    } catch (_) {}
  }
  let h = 5381, h2 = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h) ^ str.charCodeAt(i);
    h2 = (h2 * 31 + str.charCodeAt(i)) >>> 0;
  }
  return btoa(String(h >>> 0) + ':' + String(h2) + ':' + str.length);
}

async function pbkdf2(password, saltB64, iters = 150000) {
  if (!HAS_CRYPTO) return simpleHash(password, saltB64);
  try {
    const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' }, key, 256);
    return btoa(String.fromCharCode(...new Uint8Array(bits)));
  } catch (e) {
    console.warn('[auth] PBKDF2 failed, using fallback', e);
    return simpleHash(password, saltB64);
  }
}

async function hashPassword(password) {
  const salt = randB64(16);
  const hash = await pbkdf2(password, salt);
  return { salt, hash, iters: HAS_CRYPTO ? 150000 : 1, method: HAS_CRYPTO ? 'pbkdf2' : 'simple' };
}

async function verifyPassword(password, user) {
  if (!user) return false;
  if (user.salt && user.hash) {
    try {
      const h = await pbkdf2(password, user.salt, user.iters || 150000);
      if (h.length === user.hash.length) {
        let diff = 0;
        for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ user.hash.charCodeAt(i);
        if (diff === 0) return true;
      }
    } catch (_) {}
  }
  return false;
}

const Auth = {
  async register({ name, email, username, password, role = 'admin' }) {
    const users = await DB.list('users');
    if (users.some(u => u.email?.toLowerCase() === email.toLowerCase()))
      throw new Error('This email is already registered');
    const cred = await hashPassword(password);
    return DB.insert('users', { name, email: email.toLowerCase(), username, role, active: true, ...cred });
  },

  async login(identifier, password, remember = false) {
    const id = String(identifier || '').toLowerCase().trim();
    const pw = String(password || '');
    const isDefaultId = (id === 'admin@school.com' || id === 'admin');

    let users = [];
    try { users = await DB.list('users'); } catch (_) {}
    const user = users.find(u => u.email?.toLowerCase() === id || u.username?.toLowerCase() === id);

    // ফার্স্ট-রান ফলব্যাক: DB তে এখনো কোনো অ্যাডমিন ইউজার তৈরিই হয়নি (একদম নতুন ইনস্টল,
    // অথবা file:// / content:// এর মতো পরিবেশে localStorage/D1 ঠিকমতো কাজ না করলে) —
    // তখনই কেবল ডিফল্ট পাসওয়ার্ড দিয়ে ঢোকা যাবে এবং একই সাথে ইউজারটি তৈরি হয়ে যাবে।
    // একবার ইউজার তৈরি হয়ে গেলে (এবং বিশেষ করে পাসওয়ার্ড পরিবর্তনের পর) এই বাইপাসটি আর
    // কার্যকর হবে না — এরপর থেকে শুধু ডেটাবেসে সংরক্ষিত আসল (হ্যাশড) পাসওয়ার্ড দিয়েই
    // লগইন করতে হবে, পুরনো ডিফল্ট পাসওয়ার্ড কাজ করবে না।
    if (!user && isDefaultId && pw === 'admin123') {
      const session = {
        uid: 'admin_default',
        role: 'admin',
        name: 'School Admin',
        email: 'admin@school.com',
        exp: Date.now() + (remember ? 30 : 8) * 3600e3,
        tok: 'demo_' + Date.now()
      };
      try {
        (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
      } catch (_) {
        window.__SMS_SESSION__ = session;
      }
      try {
        const newUser = await Auth.register({
          name: 'School Admin', email: 'admin@school.com', username: 'admin',
          password: 'admin123', role: 'admin'
        });
        session.uid = newUser.id;
        try { (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session)); } catch (_) {}
      } catch (_) {}
      return session;
    }

    if (!user || user.active === false || !(await verifyPassword(pw, user)))
      throw new Error('Invalid credentials');

    const ttl = remember ? 30 * 24 * 3600e3 : 8 * 3600e3;
    const session = { uid: user.id, role: user.role, name: user.name, email: user.email, exp: Date.now() + ttl, tok: randB64(24) };
    try {
      (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
    } catch (_) {
      window.__SMS_SESSION__ = session;
    }
    try { await DB.update('users', user.id, { lastLogin: new Date().toISOString() }); } catch (_) {}
    return session;
  },

  session() {
    if (window.__SMS_SESSION__) {
      const s = window.__SMS_SESSION__;
      if (s.exp && s.exp < Date.now()) { delete window.__SMS_SESSION__; return null; }
      return s;
    }
    const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    try {
      const s = JSON.parse(raw);
      if (!s.exp || s.exp < Date.now()) { Auth.logout(); return null; }
      return s;
    } catch { return null; }
  },

  isLoggedIn() { return !!Auth.session(); },
  can(role) { const s = Auth.session(); return !!s && (s.role === 'admin' || s.role === role); },

  logout() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
    try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
    try { delete window.__SMS_SESSION__; } catch (_) {}
  },

  async changePassword(userId, oldPw, newPw) {
    const u = await DB.get('users', userId);
    if (!u || !(await verifyPassword(oldPw, u))) throw new Error('Current password is incorrect');
    if (String(newPw).length < 6) throw new Error('New password must be at least 6 characters');
    return DB.update('users', userId, await hashPassword(newPw));
  },

  /* Forgot password: recovery only through two fixed security questions —
     there is no other password-reset path in the admin panel. */
  SECURITY_QUESTIONS: [
    { q: 'সাইট টির নির্মাতা কে?', a: 'মো মাহবুবুর রহমান' },
    { q: 'নির্মাতার জন্ম তারিখ কত?', a: '৯ মার্চ' }
  ],
  _normAnswer(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();
  },
  _answersMatch(a1, a2) {
    return Auth._normAnswer(a1) === Auth._normAnswer(Auth.SECURITY_QUESTIONS[0].a) &&
           Auth._normAnswer(a2) === Auth._normAnswer(Auth.SECURITY_QUESTIONS[1].a);
  },
  async verifySecurityAnswers(email, a1, a2) {
    const users = await DB.list('users');
    const u = users.find(x => x.email?.toLowerCase() === String(email || '').toLowerCase());
    if (!u) throw new Error('এই ই-মেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি');
    if (!Auth._answersMatch(a1, a2)) throw new Error('উত্তর সঠিক নয়');
    return true;
  },
  async resetWithSecurityAnswers(email, a1, a2, newPw) {
    const users = await DB.list('users');
    const u = users.find(x => x.email?.toLowerCase() === String(email || '').toLowerCase());
    if (!u) throw new Error('এই ই-মেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি');
    if (!Auth._answersMatch(a1, a2)) throw new Error('উত্তর সঠিক নয়');
    if (String(newPw || '').length < 6) throw new Error('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');
    await DB.update('users', u.id, { ...(await hashPassword(newPw)), resetToken: null, resetExp: null });
    return true;
  }
};

  return true;
}

/**
 * DataTable — search + filters + sort + pagination + row actions, all client-side.
 * cols: [{key,label,render?,className?,sortable?}]
 */
class DataTable {
  constructor(host, { cols, rows, pageSize = 10, searchKeys = [], empty = 'কোনো তথ্য নেই', onRow }) {
    this.host = host; this.cols = cols; this.all = rows; this.pageSize = pageSize;
    this.searchKeys = searchKeys; this.empty = empty; this.onRow = onRow;
    this.page = 1; this.q = ''; this.filters = {}; this.sort = null;
    this.render();
  }
  setRows(rows) { this.all = rows; this.page = 1; this.render(); }
  setFilter(k, v) { this.filters[k] = v; this.page = 1; this.render(); }
  setQuery(q) { this.q = String(q || '').toLowerCase().trim(); this.page = 1; this.render(); }
  filtered() {
    let rows = this.all.filter(r => {
      for (const [k, v] of Object.entries(this.filters)) if (v && String(r[k] ?? '') !== String(v)) return false;
      if (!this.q) return true;
      return this.searchKeys.some(k => String(r[k] ?? '').toLowerCase().includes(this.q));
    });
    if (this.sort) {
      const { key, dir } = this.sort;
      rows = rows.slice().sort((a, b) => {
        const x = a[key] ?? '', y = b[key] ?? '';
        const n = (!isNaN(parseFloat(x)) && !isNaN(parseFloat(y))) ? parseFloat(x) - parseFloat(y) : String(x).localeCompare(String(y));
        return dir === 'asc' ? n : -n;
      });
    }
    return rows;
  }
  render() {
    const rows = this.filtered();
    const pages = Math.max(1, Math.ceil(rows.length / this.pageSize));
    this.page = Math.min(this.page, pages);
    const view = rows.slice((this.page - 1) * this.pageSize, this.page * this.pageSize);
    this.host.innerHTML = view.length ? `
      <div class="table-wrap"><table class="tbl">
        <thead><tr>${this.cols.map(c => `<th ${c.sortable !== false ? `data-sort="${esc(c.key)}" style="cursor:pointer"` : ''}>${esc(c.label)}${this.sort?.key === c.key ? (this.sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
        <tbody>${view.map(r => `<tr data-id="${esc(r.id)}">${this.cols.map(c =>
          `<td class="${c.className || ''}">${c.render ? c.render(r) : esc(r[c.key] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="pager">
        <button ${this.page === 1 ? 'disabled' : ''} data-p="${this.page - 1}">‹ Prev</button>
        ${Array.from({ length: pages }, (_, i) => i + 1)
          .filter(p => p === 1 || p === pages || Math.abs(p - this.page) <= 2)
          .map((p, i, arr) => (i > 0 && p - arr[i - 1] > 1 ? '<button disabled>…</button>' : '') +
            `<button class="${p === this.page ? 'on' : ''}" data-p="${p}">${p}</button>`).join('')}
        <button ${this.page === pages ? 'disabled' : ''} data-p="${this.page + 1}">Next ›</button>
        <span class="muted" style="align-self:center;font-size:.83rem;margin-left:8px">${rows.length} টি রেকর্ড</span>
      </div>` : `<div class="empty"><span class="ic">📭</span>${esc(this.empty)}</div>`;

    $$('[data-p]', this.host).forEach(b => b.onclick = () => { this.page = +b.dataset.p; this.render(); });
    $$('[data-sort]', this.host).forEach(th => th.onclick = () => {
      const key = th.dataset.sort;
      this.sort = this.sort?.key === key ? { key, dir: this.sort.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
      this.render();
    });
    if (this.onRow) $$('tbody tr', this.host).forEach(tr => this.onRow(tr, this.all.find(r => r.id === tr.dataset.id)));
  }
}

/** Build a form from a field spec; returns {html, read(el)} */
function formHTML(fields, data = {}) {
  const f = fld => {
    const v = data[fld.name] ?? fld.value ?? '';
    const common = `class="input" name="${esc(fld.name)}" id="fld_${esc(fld.name)}" ${fld.required ? 'required' : ''} ${fld.attrs || ''}`;
    let inner;
    if (fld.type === 'select')
      inner = `<select ${common}>${(fld.options || []).map(o => {
        const [val, lab] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
    else if (fld.type === 'textarea')
      inner = `<textarea ${common} rows="${fld.rows || 3}">${esc(v)}</textarea>`;
    else if (fld.type === 'file')
      inner = `<input type="file" ${common} accept="${fld.accept || 'image/*'}">
        ${v ? `<img src="${esc(v)}" style="margin-top:8px;max-height:80px;border-radius:8px">` : ''}`;
    else if (fld.type === 'checkbox')
      inner = `<label class="checkbox"><input type="checkbox" name="${esc(fld.name)}" id="fld_${esc(fld.name)}" ${v ? 'checked' : ''}> ${esc(fld.hint || '')}</label>`;
    else inner = `<input type="${fld.type || 'text'}" ${common} value="${esc(v)}" placeholder="${esc(fld.placeholder || '')}">`;
    return `<div class="field" style="${fld.full ? 'grid-column:1/-1' : ''}">
      ${fld.type === 'checkbox' ? '' : `<label for="fld_${esc(fld.name)}">${esc(fld.label)}${fld.required ? ' *' : ''}</label>`}
      ${inner}<span class="err" data-err="${esc(fld.name)}"></span></div>`;
  };
  return `<div class="row">${fields.map(f).join('')}</div>`;
}
function readForm(root, fields) {
  const out = {};
  for (const fld of fields) {
    const el = root.querySelector(`[name="${fld.name}"]`);
    if (!el) continue;
    out[fld.name] = fld.type === 'checkbox' ? el.checked : (fld.type === 'number' ? Number(el.value) : el.value.trim?.() ?? el.value);
  }
  return out;
}
function showErrors(root, errors) {
  $$('[data-err]', root).forEach(s => s.textContent = '');
  for (const [k, msg] of Object.entries(errors)) {
    const s = root.querySelector(`[data-err="${k}"]`); if (s) s.textContent = msg;
  }
}
const searchBox = (id, ph = 'Search…') =>
  `<div class="field"><input class="input" id="${id}" placeholder="🔍 ${esc(ph)}"></div>`;
const bindSearch = (el, fn) => { if (el) el.oninput = debounce(() => fn(el.value), 220); };

const rnd = a => a[Math.floor(Math.random() * a.length)];

async function seedIfEmpty() {
  // Always ensure default admin exists (fixes login issues with old/corrupt localStorage)
  try {
    const users = await DB.list('users');
    const hasAdmin = users.some(u =>
      (u.email || '').toLowerCase() === 'admin@school.com' ||
      (u.username || '').toLowerCase() === 'admin'
    );
    if (!hasAdmin) {
      await Auth.register({
        name: 'School Admin',
        email: 'admin@school.com',
        username: 'admin',
        password: 'admin123',
        role: 'admin'
      });
      console.log('[seed] default admin created');
    }
  } catch (e) {
    console.warn('[seed] admin ensure failed', e);
  }

  // Always ensure all CLASSES exist with correct order (fixes existing browser data missing/misordered classes, e.g. Nursery)
  try {
    const existingClasses = await DB.list('classes');
    for (const name of CLASSES) {
      const idx = CLASSES.indexOf(name);
      const found = existingClasses.find(c => c.name === name);
      if (!found) {
        await DB.insert('classes', { name, numeric: idx });
      } else if (found.numeric !== idx) {
        await DB.update('classes', found.id, { numeric: idx });
      }
    }
  } catch (e) { console.warn('[seed] class ensure failed', e); }

  // Always ensure every class has sections (fixes classes added later, e.g. Nursery, missing A/B/C sections)
  try {
    const allClasses = await DB.list('classes');
    const allSections = await DB.list('sections');
    for (const c of allClasses) {
      if (!allSections.some(sec => sec.classId === c.id)) {
        for (const sName of SECTIONS) await DB.insert('sections', { classId: c.id, name: sName });
      }
    }
  } catch (e) { console.warn('[seed] section ensure failed', e); }

  const school = await DB.list('school');
  if (school.length) return false;

  await DB.insert('school', DEFAULT_SCHOOL);
  // admin already ensured above

  const classRows = await DB.list('classes');
  for (const c of classRows) for (const s of SECTIONS) await DB.insert('sections', { classId: c.id, name: s });
  for (const c of classRows) {
    const list = c.numeric >= 9 ? SUBJECTS_SR : SUBJECTS_JR;
    for (const s of list) await DB.insert('subjects', {
      classId: c.id, name: s, fullMarks: 100, passMarks: 33,
      hasMcq: c.numeric >= 6, hasPractical: /Physics|Chemistry|Biology|Science|ICT/.test(s)
    });
  }
  for (const f of FEE_HEADS) await DB.insert('feeHeads', f);

  for (const [name, designation, subject, department, qualification, joiningDate, phone, email] of TEACHERS)
    await DB.insert('teachers', { name, designation, subject, department, qualification, joiningDate, phone, email, photo: '', status: 'Active' });

  // students spread across classes
  let sid = 0;
  const sessions = ['2026'];
  for (const st of STUDENT_NAMES) {
    sid++;
    const cls = classRows[Math.floor(Math.random() * classRows.length)];
    const secRows = await DB.query('sections', r => r.classId === cls.id);
    const sec = rnd(secRows);
    await DB.insert('students', {
      studentId: 'STD' + String(1000 + sid),
      admissionNo: 'ADM' + new Date().getFullYear() + String(100 + sid),
      name: st[0], fatherName: st[1], motherName: st[2], gender: st[3], bloodGroup: st[4],
      dob: `20${10 + (sid % 8)}-0${1 + (sid % 9)}-1${sid % 9}`,
      classId: cls.id, sectionId: sec?.id || '', roll: String(1 + (sid % 30)),
      session: rnd(sessions),
      phone: '+88017' + String(10000000 + sid * 137).slice(0, 8),
      guardianPhone: '+88018' + String(10000000 + sid * 271).slice(0, 8),
      address: 'Dhanmondi, Dhaka', admissionDate: '2026-01-05',
      photo: '', status: 'Active', religion: 'Islam'
    });
  }

  // exams
  for (const e of [['Half Yearly Examination', '2026'], ['Annual Examination', '2026']])
    await DB.insert('exams', { name: e[0], session: e[1] });

  for (const [title, description, date, published] of NOTICES)
    await DB.insert('notices', { title, description, date, published, attachment: '', attachmentName: '' });

  for (const [title, date, time, location, description] of EVENTS)
    await DB.insert('events', { title, date, time, location, description, image: '' });

  const albums = [['Annual Sports Day', 'বার্ষিক ক্রীড়া প্রতিযোগিতার নির্বাচিত মুহূর্ত'], ['Science Fair', 'বিজ্ঞান মেলার প্রকল্প প্রদর্শনী'], ['Campus Life', 'আমাদের ক্যাম্পাস ও শ্রেণিকক্ষ']];
  for (const [name, desc] of albums) await DB.insert('albums', { name, description: desc, cover: '' });

  // a few payments so dashboard/reports are meaningful
  const students = await DB.list('students');
  const heads = await DB.list('feeHeads');
  let rc = 0;
  for (const s of students.slice(0, 14)) {
    rc++;
    const head = rnd(heads.filter(h => h.amount > 0));
    const total = head.amount, paid = Math.random() > 0.25 ? total : Math.round(total * 0.5);
    await DB.insert('payments', {
      receiptNo: 'RCP' + String(1000 + rc),
      studentId: s.id, feeHeadId: head.id, feeType: head.name,
      month: '', session: s.session, total, paid, due: total - paid,
      method: rnd(['Cash', 'bKash', 'Nagad', 'Bank']),
      date: today(), note: '', collectedBy: 'School Admin'
    });
  }
  await DB.insert('counters', { name: 'student', value: 1000 + sid });
  await DB.insert('counters', { name: 'receipt', value: 1000 + rc });
  await DB.insert('counters', { name: 'admission', value: 100 + sid });
  void uid;
  return true;
}

enter;margin:8px 0 14px}\n.doc-title span{display:inline-block;border:1.5px solid #0b6b4f;border-radius:20px;padding:4px 22px;font-weight:700;font-size:13px;color:#0b6b4f;text-transform:uppercase;letter-spacing:1px}\n.ptbl{width:100%;border-collapse:collapse;font-size:11.6px}\n.ptbl th,.ptbl td{border:1px solid #94a3ac;padding:5px 7px;text-align:left}\n.ptbl th{background:#e8f2ee;font-weight:700}\n.ptbl td.c,.ptbl th.c{text-align:center}\n.ptbl td.r{text-align:right}\n.kv{width:100%;border-collapse:collapse;font-size:12px}\n.kv td{padding:4px 6px;vertical-align:top}\n.kv td.k{width:130px;font-weight:600;color:#33424c}\n.kv td.k::after{content:':';float:right}\n.sign-row{display:flex;justify-content:space-between;margin-top:46px;font-size:11.5px;text-align:center}\n.sign-row div{border-top:1px dotted #333;padding-top:4px;min-width:150px}\n.stu-photo{width:28mm;height:33mm;object-fit:cover;border:1px solid #94a3ac;background:#eef2f5;display:grid;place-items:center;font-size:10px;color:#7b8891}\n.doc-foot{margin-top:12px;border-top:1px solid #cbd5da;padding-top:6px;font-size:10px;color:#667;display:flex;justify-content:space-between}\n.watermark{position:absolute;inset:0;display:grid;place-items:center;opacity:.05;font-size:90px;font-weight:800;transform:rotate(-28deg);pointer-events:none}\n\n/* ---- ID card: CR80 standard 85.6mm x 54mm (portrait 54x85.6 used here) ---- */\n.idsheet{display:flex;flex-wrap:wrap;gap:6mm;justify-content:flex-start}\n.idcard{width:2.125in;height:3.375in;border-radius:3.5mm;overflow:hidden;position:relative;background:#fff;\n  border:1px solid #c5d0dc;font-size:7.2px;page-break-inside:avoid;break-inside:avoid;box-shadow:0 3px 12px rgba(13,43,94,.15);\n  display:flex;flex-direction:column;font-family:var(--doc-font,system-ui,-apple-system,sans-serif)}\n.id-header{background:linear-gradient(160deg,#5c0e1e 0%,#7a1129 55%,#f4c430 100%);color:#fff;padding:2.2mm 2.5mm 4mm;position:relative;text-align:center}\n.id-header::after{content:'';position anvas{width:100%!important;height:100%!important;display:block}\n.id-back-wave{position:absolute;left:0;right:0;bottom:0;height:7mm;background:linear-gradient(105deg,#5c0e1e 0%,#7a1129 60%,#f4c430 100%)}\n\n/* ---- admit card (unique design) ---- */\n.ac-sheet{border:3px double #0a5c47;padding:10mm!important}\n.ac-topband{background:linear-gradient(90deg,#0a5c47,#0f8a68);color:#fff;text-align:center;padding:8px;border-radius:4px;font-weight:800;font-size:16px;letter-spacing:2px;margin-bottom:10px}\n.ac-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid #e8a817;padding-bottom:8px;margin-bottom:10px}\n.ac-logo{width:56px;height:56px;border-radius:50%;background:#0a5c47;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;border:2px solid #e8a817;flex-shrink:0}\n.ac-schoolinfo{flex:1;text-align:center}\n.ac-schoolinfo h1{margin:0;font-size:18px;color:#0a5c47}\n.ac-schoolinfo p{margin:1px 0;font-size:10px;color:#333}\n.ac-body{display:flex;gap:12px}\n.ac-photo{width:28mm;height:34mm;border:1px solid #0a5c47;object-fit:cover;background:#eef2f7;flex-shrink:0}\n.ac-info{flex:1}\n.ac-info table{width:100%;border-collapse:collapse;font-size:11.5px}\n.ac-info td{padding:3px 4px}\n.ac-info td.k{font-weight:700;color:#0a5c47;width:120px;vertical-align:top}\n.ac-info td.k::after{content:':';float:right}\n.ac-subtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:var(--doc-text-size,11.5px)}\n.ac-subtable th{background:#0a5c47;color:#fff;padding:6px;text-align:left}\n.ac-subtable td{border:1px solid #ccd6e0;padding:5px 8px}\n.ac-instructions{margin-top:10px;font-size:10px;line-height:1.6;color:#333;border:1px dashed #b32020;padding:6px 10px;border-radius:4px;background:#fff8f0}\n.ac-instructions b{color:#b32020}\n.ac-stub{border-top:2px dashed #333;margin-top:16px;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:10px;flex-wrap:wrap;gap:6px}\n.ac-stub .lbl{background:#f4f6f9;padding:2px function openPrintWindow(title, bodyHTML) {
  const w = window.open('', '_blank');
  if (!w) { toast('Popup blocked — অনুগ্রহ করে popup অনুমতি দিন', 'error'); return null; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>${esc(title)}</title>
    <style>${PRINT_CSS_PLACEHOLDER}</style>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"><\/script>
    </head><body class="print-root" style="background:#e9eef1;margin:0">
    <div class="print-toolbar no-print"><b>${esc(title)}</b>
      <button class="btn btn-sm btn-light" id="btnPrint">🖨️ Print</button>
      <button class="btn btn-sm btn-accent" id="btnPdf">⬇️ Download PDF</button>
      <button class="btn btn-sm btn-ghost" id="btnClose">✖ Close</button></div>
    <div id="printRoot">${bodyHTML}</div>
    <script>
      document.getElementById('btnPrint').onclick = () => window.print();
      document.getElementById('btnClose').onclick = () => window.close();
      document.getElementById('btnPdf').onclick = () => {
        var el = document.getElementById('printRoot');
        if (window.html2pdf) {
          window.html2pdf().set({ margin:0, filename:${JSON.stringify(title)}.replace(/[^\\w\\u0980-\\u09FF -]/g,'')+'.pdf',
            image:{type:'jpeg',quality:0.98}, html2canvas:{scale:4,useCORS:true,backgroundColor:'#fff'},
            jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}, pagebreak:{mode:['css','legacy']} }).from(el).save();
        } else { window.print(); }
      };
    <\/script></body></html>`);
  w.document.close();
  return w;
}

/* QR as inline SVG-free canvas: uses qrcodejs if available in the opener, else text fallback */
function qrDataFor(text, size = 46) {
  if (window.QRCode) {
    try {
      const holder = document.createElement('div');
      new window.QRCode(holder, { text, width: size, height: size, correctLevel: window.QRCode.CorrectLevel.M });
      const cv = holder.querySelector('canvas');
      if (cv) return `<img src="${cv.toDataURL('image/png')}" style="width:12mm;height:12mm;display:block">`;
      const im = holder.querySelector('img');
      if (im && im.src) return `<img src="${im.src}" style="width:12mm;height:12mm;display:block">`;
    } catch { /* fall through */ }
  }
  return `<div style="border:1px solid #333;font-size:5px;padding:1px;text-align:center;word-break:break-all;line-height:1.1">${esc(text)}</div>`;
}

const inWords = n => {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x);
  n = Math.floor(num(n)); if (!n) return 'Zero';
  let out = '';
  if (n >= 100000) { out += three(Math.floor(n / 100000)) + ' Lakh '; n %= 100000; }
  if (n >= 1000) { out += three(Math.floor(n / 1000)) + ' Thousand '; n %= 1000; }
  if (n) out += three(n);
  return out.trim();
};

async function docResultSheet(p) {
  const s = await schoolDoc();
  const [students, classes, sections, subjects, exams, results] =
    await Promise.all(['students', 'classes', 'sections', 'subjects', 'exams', 'results'].map(c => DB.list(c)));
  const examId = p.get('exam'), classId = p.get('class'), sectionId = p.get('section');
  const mode = p.get('mode'), design = p.get('design') || 'standard';
  const cn = id => classes.find(c => c.id === id)?.name || '-';
  const sn = id => sections.find(x => x.id === id)?.name || '-';
  const exam = exams.find(e => e.id === examId);

  let picked;
  if (p.get('student')) picked = results.filter(r => r.studentId === p.get('student') && (!examId || r.examId === examId));
  else if (p.get('students')) { const ids = p.get('students').split(','); picked = results.filter(r => r.examId === examId && ids.includes(r.studentId)); }
  else picked = results.filter(r => r.examId === examId && r.classId === classId && (!sectionId || r.sectionId === sectionId));
  picked = picked.sort((a, b) => num(students.find(x => x.id === a.studentId)?.roll) - num(students.find(x => x.id === b.studentId)?.roll));

  const findStudent = sid => students.find(x => x.id === sid)
    || students.find(x => x.studentId === sid)
    || students.find(x => String(x.roll) === String(sid)) || {};

  const individual = r => {
    const st = findStudent(r.studentId);
    const ex = exams.find(e => e.id === r.examId);
    const subs = subjects.filter(x => x.classId === r.classId);
    const rows = (r.marks || []).map(m => {
      const sub = subs.find(x => x.id === m.subjectId); if (!sub) return '';
      const t = num(m.written) + num(m.mcq) + num(m.practical);
      const g = gradeOf(t / num(sub.fullMarks || 100) * 100);
      return `<tr><td>${esc(sub.name)}</td><td class="c">${num(sub.fullMarks)}</td><td class="c">${num(sub.passMarks)}</td>
        <td class="c">${num(m.written)}</td><td class="c">${num(m.mcq)}</td><td class="c">${num(m.practical)}</td>
        <td class="c"><b>${t}</b></td><td class="c">${g.g}</td><td class="c">${g.p.toFixed(2)}</td>
        <td class="c">${t >= num(sub.passMarks) ? 'Pass' : 'Fail'}</td></tr>`;
    }).join('');
    const rsLogo = s.logo ? `<img class="rs-logo" style="border-radius:50%" src="${esc(s.logo)}" alt="">`
      : `<div class="rs-logo">${esc((s.name || 'S').split(' ').map(w => w[0]).slice(0, 2).join(''))}</div>`;
    return `<div class="a4 rs-sheet" style="position:relative;${wmStyle(s)}">
      <div class="rs-border"></div>
      <div class="rs-watermark ${r.status === 'Pass' ? 'pass' : 'fail'}">${r.status === 'Pass' ? 'PASS' : 'FAIL'}</div>
      <div class="rs-top">
        ${rsLogo}
        <div class="rs-titleblock">
          <h1>${esc(s.name)}</h1>
          <p>${esc(s.address)}</p>
          <p>Phone: ${esc(s.phone)} ${s.eiin ? '• EIIN: ' + esc(s.eiin) : ''}</p>
        </div>
        <div class="rs-examtag">${esc(ex?.name || '-')}<br>${esc(r.session || '-')}</div>
      </div>
      <div class="rs-ribbon">ACADEMIC TRANSCRIPT / RESULT SHEET</div>
      <div class="rs-idrow">
        ${design === 'standard' ? (st.photo ? `<img class="stu-photo" src="${esc(st.photo)}" alt="">` : `<div class="stu-photo">Photo</div>`) : ''}
        <div class="rs-namebox">
          <div class="rs-name">${esc(st.name || '—')}</div>
          <div class="rs-sub">Class ${esc(cn(r.classId))} — ${esc(sn(r.sectionId))} &nbsp;•&nbsp; Roll ${esc(st.roll || '-')} &nbsp;•&nbsp; ID ${esc(st.studentId || '-')}</div>
          <div class="rs-sub2">Father: ${esc(st.fatherName || '-')} &nbsp; Mother: ${esc(st.motherName || '-')} &nbsp; DOB: ${fmtDate(st.dob)}</div>
        </div>
        <div class="rs-medal ${esc(r.status || '')}">
          <div class="g">${esc(r.grade || '-')}</div>
          <div class="p">GPA ${num(r.gpa).toFixed(2)}</div>
        </div>
      </div>
      <table class="ptbl" style="margin-top:6px;position:relative;z-index:1">
        <thead><tr><th>Subject</th><th class="c">Full</th><th class="c">Pass</th><th class="c">Written</th>
          <th class="c">MCQ</th><th class="c">Practical</th><th class="c">Total</th><th class="c">Grade</th>
          <th class="c">GP</th><th class="c">Result</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="rs-summary">
        <div class="rs-chip"><b>${num(r.totalMarks)}</b><span>Total Marks</span></div>
        <div class="rs-chip"><b>${num(r.average).toFixed(2)}</b><span>Average</span></div>
        <div class="rs-chip"><b>${num(r.gpa).toFixed(2)}</b><span>GPA</span></div>
        <div class="rs-chip"><b>${esc(r.grade)}</b><span>Grade</span></div>
        <div class="rs-chip"><b>${esc(r.position || '-')}</b><span>Position</span></div>
        <div class="rs-chip"><b>${esc(r.status)}</b><span>Result</span></div>
      </div>
      <p style="font-size:11.5px;margin-top:8px;position:relative;z-index:1"><b>Remarks:</b> ${esc(r.remarks || (r.status === 'Pass' ? 'Keep up the good work.' : 'Needs improvement.'))}</p>
      <div class="sign-row" style="position:relative;z-index:1"><div>Class Teacher</div><div>Examination Controller</div>${principalSignCell(s)}</div>
      ${docFoot(s, 'Computer generated result sheet — verify at ' + (s.website || ''))}</div>`;
  };

  const tabulation = () => {
    const subs = subjects.filter(x => x.classId === classId);
    const rows = picked.map((r, i) => {
      const st = findStudent(r.studentId);
      const cells = subs.map(sub => {
        const m = (r.marks || []).find(x => x.subjectId === sub.id) || {};
        return `<td class="c">${num(m.written) + num(m.mcq) + num(m.practical)}</td>`;
      }).join('');
      return `<tr><td class="c">${i + 1}</td><td>${esc(st.roll || '')}</td><td>${esc(st.name || '')}</td>
        <td>${esc(st.studentId || '')}</td>${cells}<td class="c"><b>${num(r.totalMarks)}</b></td>
        <td class="c">${num(r.gpa).toFixed(2)}</td><td class="c">${esc(r.grade)}</td>
        <td class="c">${esc(r.position || '-')}</td><td class="c">${esc(r.status)}</td></tr>`;
    }).join('');
    return `<div class="a4" style="width:297mm">
      ${docHead(s, `Tabulation Sheet — ${exam?.name || ''} • Class ${cn(classId)} ${sectionId ? '(' + sn(sectionId) + ')' : ''}`)}
      <table class="ptbl"><thead><tr><th class="c">#</th><th>Roll</th><th>Name</th><th>Student ID</th>
        ${subs.map(x => `<th class="c">${esc(x.name.slice(0, 10))}</th>`).join('')}
        <th class="c">Total</th><th class="c">GPA</th><th class="c">Grade</th><th class="c">Pos</th><th class="c">Result</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="12">কোনো ফলাফল নেই</td></tr>`}</tbody></table>
      <div class="sign-row"><div>Prepared By</div><div>Exam Controller</div>${principalSignCell(s)}</div>${docFoot(s)}</div>`;
  };

  return {
    title: mode === 'tabulation' ? 'Tabulation Sheet' : `Result Sheet — ${picked.length} student(s)`,
    html: !picked.length ? '<div class="a4"><p>কোনো ফলাফল পাওয়া যায়নি।</p></div>'
      : (mode === 'tabulation' ? tabulation() : picked.map(individual).join(''))
  };
}

async function docFeeReport(p) {
  const s = await schoolDoc();
  const [payments, students] = await Promise.all(['payments', 'students'].map(c => DB.list(c)));
  const from = p.get('from'), to = p.get('to');
  const rows = payments.filter(x => (!from || x.date >= from) && (!to || x.date <= to))

/** Handles any legacy "…/print/<name>.html?<query>" URL by rendering it in a new window. */
async function openPrintDoc(url) {
  const m = String(url).match(/print\/([\w-]+)\.html(?:\?(.*))?$/);
  if (!m) return false;
  const fn = PRINT_DOCS[m[1]];
  if (!fn) return false;
  try {
    const { title, html } = await fn(new URLSearchParams(m[2] || ''));
    const s = await schoolDoc();
    const docVars = `--doc-font:${(s.docFont || 'system-ui,-apple-system,sans-serif').replace(/"/g, "'")};--doc-name-size:${s.docNameSize || 10}pt;--doc-text-size:${s.docTextSize || 9.5}pt;font-family:var(--doc-font)`;
    openPrintWindow(title, `<div style="${esc(docVars)}">${html}</div>`);
  } catch (e) { toast(e.message, 'error'); }
  return true;
}

/** Global interception: <a href="../print/…"> clicks and window.open("../print/…") calls. */
function installPrintInterceptor() {
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href*="print/"]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (!/print\/[\w-]+\.html/.test(href)) return;
    e.preventDefault();
    openPrintDoc(href);
  }, true);

  const nativeOpen = window.open.bind(window);
  window.open = function (url, ...rest) {
    if (url && /print\/[\w-]+\.html/.test(String(url))) { openPrintDoc(String(url)); return null; }
    return nativeOpen(url, ...rest);
  };
}
